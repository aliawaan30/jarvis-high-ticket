  /* ══ the journey: five screens, thumb to WhatsApp ══ */

  /* ── journey: the sequence plays itself ── */
  body.anim .journey .jstep .jvis { transition:box-shadow .5s ease, border-color .5s ease, transform .5s ease; }
  body.anim .journey.play .jstep .jvis { animation:jlift 15s ease-in-out infinite; }
  body.anim .journey.play .jstep:nth-child(1) .jvis { animation-delay:0s }
  body.anim .journey.play .jstep:nth-child(2) .jvis { animation-delay:2.5s }
  body.anim .journey.play .jstep:nth-child(3) .jvis { animation-delay:5s }

  body.anim .journey.play .jstep:nth-child(5) .jvis { animation-delay:10s }

  @keyframes jlift {

  body.anim .journey.play .jstep .jclock { transition:color .4s ease; animation:jclk 15s ease-in-out infinite; }
  body.anim .journey.play .jstep:nth-child(1) .jclock { animation-delay:0s }
  body.anim .journey.play .jstep:nth-child(2) .jclock { animation-delay:2.5s }
  body.anim .journey.play .jstep:nth-child(3) .jclock { animation-delay:5s }
  body.anim .journey.play .jstep:nth-child(4) .jclock { animation-delay:7.5s }
  body.anim .journey.play .jstep:nth-child(5) .jclock { animation-delay:10s }
  body.anim .journey.play .jstep:nth-child(6) .jclock { animation-delay:12.5s }
  @keyframes jclk { 0%,3%{ letter-spacing:.2em } 6%,14%{ letter-spacing:.34em } 18%,100%{ letter-spacing:.2em } }
  .jstep .jbadge { position:absolute; top:15px; right:-5px; z-index:3; opacity:0;

  body.anim .journey.play .jstep:nth-child(1) .jbadge { animation-delay:0s }
  body.anim .journey.play .jstep:nth-child(2) .jbadge { animation-delay:2.5s }
  body.anim .journey.play .jstep:nth-child(3) .jbadge { animation-delay:5s }
  body.anim .journey.play .jstep:nth-child(4) .jbadge { animation-delay:7.5s }
  body.anim .journey.play .jstep:nth-child(5) .jbadge { animation-delay:10s }
  body.anim .journey.play .jstep:nth-child(6) .jbadge { animation-delay:12.5s }
  .jstep.win .jbadge { background:var(--sand); color:#3B2E05; box-shadow:0 5px 14px rgba(181,122,46,.4); }
  @keyframes jbdg { 0%,3%{opacity:0; transform:translateY(4px)} 7%,14%{opacity:1; transform:none} 18%,100%{opacity:0; transform:translateY(4px)} }
  .jr-line i { position:absolute; top:-2.5px; left:0; width:8px; height:8px; border-radius:50%;

  @media (prefers-reduced-motion:reduce){
