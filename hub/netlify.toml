# Netlify site settings: Base directory = hub. Everything else comes from here.
[build]
  command = "python3 ../scripts/build_hub.py"
  publish = "dist"
  functions = "functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
