# Netlify site settings: Base directory = hub. Everything else comes from here.
[build]
  command = "python3 ../scripts/build_hub.py"
  publish = "dist"
  functions = "functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
