<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{
  --ground:#ffffff; --ground-2:#f5faf8; --surface:#ffffff; --surface-sunk:#f7fbf9;
  --ink:#15171d; --ink-2:#3b414f; --ink-3:#6b7280; --ink-4:#9aa0ab;
  --line:#e6eae8; --line-2:#cfd8d4;
  --accent:#32d09f; --accent-deep:#14926c; --accent-ink:#052e21;
  --accent-tint:#e7faf3; --accent-tint-2:#ccf3e5; --accent-line:#90e5c8;
  --accent2:#8b5cf6; --accent2-deep:#6a3de0; --accent2-tint:#f2edff; --accent2-tint-2:#e2d8fd; --accent2-line:#c9b6f9;
  --ok:#0f8a55; --ok-tint:#e4f6ed; --warn:#a2560d; --warn-tint:#fdf0e2;
  --term:#0d1a15; --term-2:#12241c; --term-ink:#8fe9c8; --term-dim:#4d8f76;
  --radius:18px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(21,23,29,0.05);
  --shadow-md:0 1px 2px rgba(21,23,29,0.05),0 8px 24px -12px rgba(21,23,29,0.16);
  --shadow-lg:0 1px 2px rgba(21,23,29,0.05),0 12px 28px -14px rgba(21,23,29,0.18),0 40px 64px -48px rgba(50,208,159,0.4);
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(0.2,0.7,0.3,1);
  --mod:var(--accent); --mod-deep:var(--accent-deep); --mod-ink:var(--accent-ink);
  --mod-tint:var(--accent-tint); --mod-tint-2:var(--accent-tint-2); --mod-line:var(--accent-line);
  --alt:var(--accent2); --alt-deep:var(--accent2-deep); --alt-tint:var(--accent2-tint); --alt-line:var(--accent2-line);
}
body.mod-walk{
  --mod:#8b5cf6; --mod-deep:#6a3de0; --mod-ink:#f4f0ff;
  --mod-tint:#f2edff; --mod-tint-2:#e2d8fd; --mod-line:#c9b6f9;
  --alt:#32d09f; --alt-deep:#14926c; --alt-tint:#e7faf3; --alt-line:#90e5c8;
  --shadow-lg:0 1px 2px rgba(21,23,29,0.05),0 12px 28px -14px rgba(21,23,29,0.18),0 40px 64px -48px rgba(139,92,246,0.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
body{min-height:100dvh;background-image:radial-gradient(900px 460px at 12% -180px,rgba(50,208,159,0.10),transparent 68%),radial-gradient(760px 420px at 92% -60px,rgba(139,92,246,0.09),transparent 66%);background-repeat:no-repeat;background-attachment:fixed;}
body.mod-walk{background-image:radial-gradient(900px 460px at 12% -180px,rgba(139,92,246,0.11),transparent 68%),radial-gradient(760px 420px at 92% -60px,rgba(50,208,159,0.09),transparent 66%);}
::selection{background:var(--mod-tint-2);color:var(--mod-deep);}
.shell{max-width:768px;margin:0 auto;padding:122px 20px 96px;}
p{margin:0 0 13px;color:var(--ink-2);}
ul{padding-left:20px;margin:8px 0 13px;color:var(--ink-2);}
li{margin-bottom:4px;}
.muted{color:var(--ink-3);}
.flag{display:inline-block;background:var(--warn-tint);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:.76rem;font-weight:600;font-family:var(--mono);}
/* ------- progress rail ------- */
.progress{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,0.84);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);}
.progress-inner{max-width:768px;margin:0 auto;padding:13px 20px 14px;}
.progress-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:10px;}
.progress-lead{display:flex;align-items:baseline;gap:10px;min-width:0;}
.progress-count{font-family:var(--mono);font-weight:700;white-space:nowrap;color:var(--mod-deep);font-size:18px;line-height:1;}
.progress-of{color:var(--ink-4);font-size:13px;}
.progress-title{font-size:14px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.segments{display:flex;gap:5px;}
.segment{flex:1;height:7px;border-radius:99px;background:var(--ground-2);box-shadow:inset 0 0 0 1px rgba(21,23,29,0.05);position:relative;overflow:hidden;transition:background 480ms var(--ease);}
.segment::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--mod-deep),var(--mod) 65%,var(--alt));transform:scaleX(0);transform-origin:left;transition:transform 520ms var(--ease);}
.segment.is-filled::after{transform:scaleX(1);}
.segment.is-current{background:var(--mod-tint-2);}
.segment.is-current::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85),transparent);transform:translateX(-100%);animation:sweep 2.2s var(--ease) infinite;}
@keyframes sweep{to{transform:translateX(100%);}}
/* ------- hero ------- */
.hero{margin-bottom:42px;animation:rise 620ms var(--ease) both;}
.eyebrow{margin:0 0 14px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mod-deep);font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.eyebrow::before{content:'';width:18px;height:2px;border-radius:2px;background:var(--mod);flex:0 0 auto;}
.hero h1{margin:0 0 12px;font-family:var(--display);font-size:clamp(30px,7.4vw,47px);line-height:1.04;letter-spacing:-0.03em;font-weight:800;color:var(--ink);}
.hero .lede{font-size:18.5px;color:var(--ink-2);max-width:56ch;}
.hero-fig{margin:26px 0 4px;padding:20px 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.hero-fig svg{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--ink);}
.hero-fig figcaption{margin-top:10px;text-align:center;color:var(--ink-3);font-size:.88rem;}
/* ------- steps + spine ------- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;}
.steps>li{position:relative;}
.steps>li+li::before{content:'';position:absolute;left:41px;top:-19px;width:2px;height:20px;border-radius:2px;background:var(--line-2);transition:background 420ms var(--ease);}
.steps>li.spine-on+li::before{background:linear-gradient(180deg,var(--mod),var(--mod-line));box-shadow:0 0 8px rgba(50,208,159,0.35);}
body.mod-walk .steps>li.spine-on+li::before{box-shadow:0 0 8px rgba(139,92,246,0.35);}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;scroll-margin-top:108px;box-shadow:var(--shadow-sm);transition:border-color 260ms var(--ease),box-shadow 260ms var(--ease),background 260ms var(--ease),transform 200ms var(--ease);}
.step:hover{transform:translateY(-1px);}
.step.is-locked:hover{transform:none;}
.step.is-locked{background:rgba(255,255,255,0.5);border-style:dashed;box-shadow:none;}
.step.is-open{border-color:var(--mod-line);box-shadow:var(--shadow-lg);}
.step.is-done{background:var(--surface-sunk);}
.step.just-passed{animation:pass-pop 700ms var(--ease);}
@keyframes pass-pop{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(15,138,85,0.4);}35%{transform:scale(1.012);box-shadow:0 0 0 8px rgba(15,138,85,0.12);}100%{transform:scale(1);box-shadow:0 0 0 16px rgba(15,138,85,0);}}
/* type edge strips */
.step.t-build.is-open{border-left:4px solid var(--accent);}
.step.t-chat.is-open{border-left:4px solid var(--accent2);}
.step.t-phone.is-open{border-left:4px solid #14926c;}
.step-head{display:flex;align-items:center;gap:14px;}
.step-badge{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--ground-2);border:1px solid var(--line);font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink-3);transition:all 220ms var(--ease);}
.step.is-locked .step-badge{background:transparent;color:var(--ink-4);border-style:dashed;}
.step.is-open .step-badge{background:linear-gradient(180deg,var(--mod),var(--mod-deep));color:var(--mod-ink);border-color:transparent;box-shadow:0 4px 12px -4px var(--mod);}
.step.is-done .step-badge{background:var(--ok-tint);color:var(--ok);border-color:rgba(15,138,85,0.28);}
.step.is-done .step-badge svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:tickdraw 420ms var(--ease) 120ms forwards;}
@keyframes tickdraw{to{stroke-dashoffset:0;}}
.step-heading{flex:1 1 auto;min-width:0;}
.step-title{margin:0;font-family:var(--display);font-size:20px;line-height:1.22;font-weight:700;letter-spacing:-0.02em;color:var(--ink);}
.step.is-locked .step-title{color:var(--ink-2);}
.step-n{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-4);display:block;margin-bottom:3px;}
.step.is-open .step-n{color:var(--mod-deep);}
.step-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;border-radius:99px;padding:5px 12px;}
.step-chip.is-open{background:var(--mod-tint);color:var(--mod-deep);border:1px solid var(--mod-line);}
.step-chip.is-done{background:var(--ok-tint);color:var(--ok);border:1px solid rgba(15,138,85,0.28);}
.step-chip.is-locked{background:transparent;color:var(--ink-4);border:1px dashed var(--line-2);}
.step-locked-note{margin:12px 0 0 48px;font-size:14px;color:var(--ink-4);}
.step-body{margin-top:20px;animation:rise 420ms var(--ease) both;}
@keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
/* real-world action ribbon */
.act{display:inline-flex;align-items:center;gap:8px;background:var(--ground-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);margin:0 0 12px;}
.act svg{width:20px;height:20px;display:block;color:var(--mod-deep);}
/* ------- BUILD terminal panels ------- */
.prompt{position:relative;background:var(--term);border:1px solid #1d3a2e;border-radius:14px;padding:52px 18px 18px;margin:12px 0 14px;font-family:var(--mono);font-size:.85rem;color:var(--term-ink);white-space:pre-wrap;overflow-wrap:break-word;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 10px 26px -14px rgba(13,26,21,0.55);}
.prompt::before{content:"PASTE INTO BASE44";position:absolute;top:0;left:0;right:0;height:36px;display:flex;align-items:center;padding-left:64px;font-size:.64rem;letter-spacing:.16em;color:var(--term-dim);font-weight:700;font-family:var(--body);background:var(--term-2);border-bottom:1px solid #1d3a2e;border-radius:13px 13px 0 0;}
.prompt::after{content:'';position:absolute;top:14px;left:18px;width:8px;height:8px;border-radius:50%;background:#2fbf8f;box-shadow:14px 0 0 #f2b84b,28px 0 0 #ef7b6a;}
/* CHAT bubbles */
.prompt.chat{background:var(--accent2-tint);border:1px solid var(--accent2-line);border-radius:16px 16px 16px 5px;color:#3a2a72;box-shadow:var(--shadow-sm);padding:48px 18px 16px;}
.prompt.chat::before{content:"TO YOUR CO-FOUNDER";background:transparent;border-bottom:1px dashed var(--accent2-line);color:var(--accent2-deep);padding-left:40px;border-radius:15px 15px 0 0;}
.prompt.chat::after{top:11px;left:16px;width:14px;height:14px;background:linear-gradient(180deg,var(--accent2),var(--accent2-deep));box-shadow:none;}
/* pwrap variants (labelled panels with pre) */
.pwrap{position:relative;background:var(--accent2-tint);border:1px solid var(--accent2-line);border-radius:16px 16px 16px 5px;padding:48px 18px 16px;margin:12px 0 14px;box-shadow:var(--shadow-sm);}
.pwrap .plabel{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;padding-left:40px;font-size:.64rem;letter-spacing:.16em;color:var(--accent2-deep);font-weight:700;font-family:var(--body);border-bottom:1px dashed var(--accent2-line);margin:0;}
.pwrap::after{content:'';position:absolute;top:10px;left:16px;width:14px;height:14px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent2-deep));}
.pwrap pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:var(--mono);font-size:.85rem;color:#3a2a72;max-height:340px;overflow-y:auto;}
/* PHONE frame */
.pwrap.is-phone{background:#101418;border:1px solid #2a3340;border-radius:26px;padding:64px 22px 22px;box-shadow:0 18px 40px -18px rgba(16,20,24,0.55);}
.pwrap.is-phone::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:86px;height:18px;border-radius:99px;background:#000;}
.pwrap.is-phone::after{display:none;}
.pwrap.is-phone .plabel{position:absolute;top:34px;left:22px;right:22px;height:26px;display:flex;align-items:center;gap:8px;padding-left:16px;font-size:.62rem;letter-spacing:.14em;color:#7ce7c0;border-bottom:1px solid #223229;background:rgba(50,208,159,0.08);border-radius:8px;}
.pwrap.is-phone .plabel::before{content:'';width:7px;height:7px;border-radius:50%;background:#32d09f;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.pwrap.is-phone pre{color:#e8eef2;font-family:var(--body);font-size:.94rem;line-height:1.65;}
/* copy buttons */
.copybtn,.copy{position:absolute;top:5px;right:8px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);border-radius:9px;padding:5px 13px;font-family:var(--body);font-size:.78rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm);transition:all 160ms var(--ease);z-index:2;}
.prompt:not(.chat) .copybtn{background:#173026;border-color:#26543f;color:#8fe9c8;}
.pwrap.is-phone .copy{top:36px;background:#1b2530;border-color:#31404f;color:#cfe0ea;}
.copybtn:hover,.copy:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
.copybtn.did,.copy.did{background:var(--ok-tint) !important;border-color:rgba(15,138,85,0.35) !important;color:var(--ok) !important;}
.copybtn:focus-visible,.copy:focus-visible{outline:2px solid var(--alt);outline-offset:2px;}
/* what-you-should-see mini window */
.see{position:relative;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:12px;padding:40px 16px 12px;margin:14px 0;color:var(--ink-3);font-size:.95rem;background:var(--surface);box-shadow:var(--shadow-sm);}
.see::before{content:"WHAT YOU SHOULD SEE";position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;padding-left:56px;font-size:.62rem;letter-spacing:.15em;font-weight:700;color:var(--ink-4);font-family:var(--body);background:var(--ground-2);border-bottom:1px solid var(--line);border-radius:11px 11px 0 0;}
.see::after{content:'';position:absolute;top:12px;left:14px;width:6px;height:6px;border-radius:50%;background:var(--line-2);box-shadow:11px 0 0 var(--line-2),22px 0 0 var(--line-2);}
.see b{color:var(--accent-deep);}
.callout{background:var(--mod-tint);border:1px solid var(--mod-line);border-radius:var(--radius-sm);padding:16px 20px;margin:14px 0;}
/* milestone checkpoint cards */
.step.t-mile{border-width:2px;}
.step.t-mile.is-open{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--mod),var(--alt)) border-box;box-shadow:var(--shadow-lg);}
.step.t-mile .step-chip.is-open{background:linear-gradient(120deg,var(--mod-tint),var(--alt-tint));}
.mile-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--mod-deep);background:var(--mod-tint);border:1px solid var(--mod-line);border-radius:99px;padding:4px 12px;margin:0 0 12px;}
.mile-tag svg{width:12px;height:12px;}
/* file download chips */
.filechip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 16px;margin:4px 10px 10px 0;font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow-sm);transition:all 160ms var(--ease);}
.filechip:hover{transform:translateY(-1px);border-color:var(--mod-line);color:var(--mod-deep);box-shadow:var(--shadow-md);}
.filechip svg{width:17px;height:17px;color:var(--mod-deep);}
.filechip small{font-family:var(--body);font-weight:500;color:var(--ink-4);}
/* done button */
.btn-done{appearance:none;border:1px solid transparent;border-radius:12px;font-family:var(--body);font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;padding:12px 18px;width:100%;margin-top:20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(180deg,var(--mod),var(--mod-deep));color:var(--mod-ink);box-shadow:0 1px 2px rgba(21,23,29,0.12),0 8px 20px -10px var(--mod);transition:transform 140ms var(--ease),box-shadow 160ms var(--ease);}
.btn-done:hover{transform:translateY(-1px);}
.btn-done:active{transform:translateY(1px) scale(0.995);}
.btn-done:focus-visible{outline:2px solid var(--alt);outline-offset:3px;}
/* outro finish card */
.outro{margin-top:44px;animation:rise 520ms var(--ease) both;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--mod),var(--alt)) border-box;border:2px solid transparent;border-radius:var(--radius);padding:34px 28px;text-align:center;box-shadow:var(--shadow-lg);}
.finish-badge{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(180deg,var(--mod),var(--mod-deep));display:grid;place-items:center;color:var(--mod-ink);box-shadow:0 10px 24px -10px var(--mod);}
.finish-badge svg{width:28px;height:28px;}
.finish-title{margin:0 0 6px;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);}
.finish-sub{margin:0 0 6px;color:var(--ink-3);font-size:.98rem;}
.next{display:inline-block;margin-top:16px;background:linear-gradient(180deg,var(--mod),var(--mod-deep));color:var(--mod-ink);font-weight:700;border-radius:12px;padding:13px 24px;text-decoration:none;font-family:var(--display);box-shadow:0 8px 20px -10px var(--mod);}
.next:hover{transform:translateY(-1px);}
.nextpage{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-3);font-size:.95rem;}
.startover{display:block;margin:46px auto 0;background:none;border:none;color:var(--ink-4);font-size:12.5px;font-family:var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.startover:hover{color:var(--ink-2);}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}.segment.is-current::before{display:none;}}
@media(max-width:600px){.step{padding:18px;}.steps>li+li::before{left:35px;}.shell{padding-top:112px;}}


.pwrap.is-skill{padding-bottom:36px;}
.pwrap.is-skill pre{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px;}
.pwrap.is-skill .sfade{position:absolute;left:1px;right:1px;bottom:1px;height:60px;pointer-events:none;border-radius:0 0 16px 5px;background:linear-gradient(to bottom,rgba(242,237,255,0) 0%,rgba(242,237,255,0.9) 60%,#f2edff 100%);}
.pwrap.is-skill .shint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:.6rem;letter-spacing:.14em;font-weight:700;font-family:var(--body);color:var(--accent2-deep);opacity:.7;z-index:3;pointer-events:none;}
.pwrap.is-skill .copy{background:var(--accent2);border-color:var(--accent2-deep);color:#fff;font-weight:700;padding:6px 17px;}
.pwrap.is-skill .copy:hover{background:var(--accent2-deep);border-color:var(--accent2-deep);}
@media(max-width:600px){.pwrap.is-skill pre{max-height:190px;font-size:.8rem;}}
</style>
<style>
body.mod-call{
  --mod:#32d09f; --mod-deep:#14926c; --mod-ink:#052e21;
  --mod-tint:#e7faf3; --mod-tint-2:#ccf3e5; --mod-line:#90e5c8;
  --alt:#32d09f; --alt-deep:#14926c; --alt-tint:#e7faf3; --alt-line:#90e5c8;
  --shadow-lg:0 1px 2px rgba(21,23,29,0.05),0 12px 28px -14px rgba(21,23,29,0.18),0 40px 64px -48px rgba(239,143,46,0.38);
}
