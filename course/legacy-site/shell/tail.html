</main>
<script>
window.PAGECFG={"miles": [], "downloads": []};
(function(){
  var KEY='{{KEY}}';
  var CFG=window.PAGECFG||{miles:[],downloads:[]};
  var lis=[].slice.call(document.querySelectorAll('.steps > li'));
  var total=lis.length;
  var segs=[].slice.call(document.querySelectorAll('.segment'));
  var countEl=document.getElementById('done-count');
  var outro=document.getElementById('outro');
  function getDone(){try{var v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?0:Math.min(v,total);}catch(e){return 0;}}
  function setDone(n){try{localStorage.setItem(KEY,String(n));}catch(e){}}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* ---- audio ---- */
  var ac=null;
  function ctx(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}}
  function ding(){var a=ctx();if(!a)return;var now=a.currentTime;var out=a.createGain();out.gain.value=0.13;out.connect(a.destination);[[880,0,0.34],[1318.5,0.075,0.32]].forEach(function(n){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(n[0],now+n[1]);g.gain.setValueAtTime(0.0001,now+n[1]);g.gain.exponentialRampToValueAtTime(1,now+n[1]+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+n[1]+n[2]);o.connect(g);g.connect(out);o.start(now+n[1]);o.stop(now+n[1]+n[2]+0.05);});}
  function fanfare(){var a=ctx();if(!a)return;var now=a.currentTime;var out=a.createGain();out.gain.value=0.12;out.connect(a.destination);[523.25,659.25,783.99,1046.5].forEach(function(f,i){var at=i*0.11;var o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(f,now+at);g.gain.setValueAtTime(0.0001,now+at);g.gain.exponentialRampToValueAtTime(1,now+at+0.015);g.gain.exponentialRampToValueAtTime(0.0001,now+at+0.7);o.connect(g);g.connect(out);o.start(now+at);o.stop(now+at+0.75);});}
  function tickSnd(){var a=ctx();if(!a)return;var now=a.currentTime;var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(1650,now);o.frequency.exponentialRampToValueAtTime(950,now+0.05);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(0.06,now+0.006);g.gain.exponentialRampToValueAtTime(0.0001,now+0.06);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+0.08);}
  /* ---- confetti ---- */
  function confetti(){if(reduce)return;var cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';document.body.appendChild(cv);var c=cv.getContext('2d');if(!c){cv.remove();return;}var dpr=Math.min(window.devicePixelRatio||1,2);var w=window.innerWidth,h=window.innerHeight;cv.width=w*dpr;cv.height=h*dpr;c.scale(dpr,dpr);var cols=['#32d09f','#14926c','#8b5cf6','#c9b6f9','#8b5cf6','#15171d'];var n=w<600?90:160;var ps=[];for(var i=0;i<n;i++){ps.push({x:w*(0.5+(Math.random()-0.5)*0.5),y:h*0.35+Math.random()*40,vx:(Math.random()-0.5)*9,vy:-6-Math.random()*9,s:5+Math.random()*7,r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.35,col:cols[Math.floor(Math.random()*cols.length)]});}var st=performance.now(),raf=0,dur=2000;function fr(now){var el=now-st,life=Math.min(el/dur,1);c.clearRect(0,0,w,h);ps.forEach(function(p){p.vy+=0.32;p.vx*=0.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=1-life*life;c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);c.restore();});if(el<dur){raf=requestAnimationFrame(fr);}else{cancelAnimationFrame(raf);cv.remove();}}raf=requestAnimationFrame(fr);}
  /* ---- icons ---- */
  var LOCK='<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="4.5" y="8.5" width="11" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.2 8.5V6.6a2.8 2.8 0 0 1 5.6 0v1.9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  var TICK='<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4.5 10.5 8.3 14.3 15.5 6.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var FLAGI='<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 17V3.5"/><path d="M5 4h9.5l-2.2 3 2.2 3H5" fill="currentColor" stroke="none"/></svg>';
  var BOLT='<svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><path d="M11 2 4 11.5h4.4L8.6 18l7-9.5h-4.4L11 2z"/></svg>';
  var FILE='<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5H5.8A1.3 1.3 0 0 0 4.5 3.8v12.4a1.3 1.3 0 0 0 1.3 1.3h8.4a1.3 1.3 0 0 0 1.3-1.3V6.5l-4-4z"/><path d="M11.5 2.5v4h4"/><path d="M10 9v5m0 0-2.2-2.2M10 14l2.2-2.2"/></svg>';
  /* ---- classify step types ---- */
  var ACT=/^(go |open |ring|make the call|watch|download|upload|get |send |text |scroll|look for|note the|swap in|click around)/i;
  lis.forEach(function(li,i){
    var card=li.querySelector('.step');if(!card)return;
    var t='';
    if(card.querySelector('.prompt:not(.chat)'))t='t-build';
    else if(card.querySelector('.prompt.chat'))t='t-chat';
    var pl=card.querySelector('.pwrap .plabel');
    if(pl){var lt=pl.textContent.toUpperCase();
      if(lt.indexOf('PHONE')>-1){t='t-phone';pl.parentNode.classList.add('is-phone');pl.textContent='On the call';}
      else t='t-chat';}
    var titleEl=card.querySelector('.step-title-text');
    var title=titleEl?titleEl.textContent:'';
    if(!t&&ACT.test(title.trim()))t='t-act';
    if(CFG.miles.some(function(m){return title.indexOf(m)>-1;}))t=(t?t+' ':'')+'t-mile';
    if(t)card.setAttribute('data-t',t);
    var body=card.querySelector('.step-body');
    if(body&&/(^|\s)t-mile(\s|$)/.test(t)){var mt=document.createElement('span');mt.className='mile-tag';mt.innerHTML=FLAGI+' CHECKPOINT';body.insertBefore(mt,body.firstChild);}
    else if(body&&t==='t-act'){var ar=document.createElement('span');ar.className='act';ar.innerHTML=BOLT+' REAL WORLD MOVE';body.insertBefore(ar,body.firstChild);}
  });
  /* ---- file download chips ---- */
  CFG.downloads.forEach(function(d){
    var li=lis[d.step];if(!li)return;
    var pre=li.querySelector('.pwrap pre');if(!pre)return;
    var chip=document.createElement('button');chip.type='button';chip.className='filechip';
    chip.innerHTML=FILE+d.name+' <small>download</small>';
    chip.addEventListener('click',function(){
      try{var blob=new Blob([pre.innerText],{type:'text/markdown'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);tickSnd();}
      catch(e){var btn=li.querySelector('.copy');if(btn)btn.click();}
    });
    var wrap=li.querySelector('.pwrap');wrap.parentNode.insertBefore(chip,wrap);
  });
  /* ---- render ---- */
  function render(done,animateIdx){
    lis.forEach(function(li,i){
      var st=i<done?'done':(i===done?'open':'locked');
      var card=li.querySelector('.step');
      var t=card.getAttribute('data-t')||'';
      card.className='step is-'+st+(t?' '+t.split(' ').join(' '):'')+(i===animateIdx?' just-passed':'');
      li.className=i<done?'spine-on':'';
      var badge=card.querySelector('.step-badge');
      var isMile=t.indexOf('t-mile')>-1;
      badge.innerHTML=st==='done'?TICK:(st==='locked'?LOCK:(isMile?FLAGI:String(i+1)));
      var chip=card.querySelector('.step-chip');
      chip.className='step-chip is-'+st;
      chip.innerHTML=st==='done'?'Done':(st==='locked'?LOCK:(isMile?'Checkpoint':'Start'));
      var body=card.querySelector('.step-body');
      if(body)body.hidden=(st==='locked');
      var note=card.querySelector('.step-locked-note');
      if(note)note.hidden=(st!=='locked');
      var btn=card.querySelector('.btn-done');
      if(btn)btn.hidden=(st!=='open');
    });
    segs.forEach(function(s,i){s.className='segment'+(i<done?' is-filled':(i===done?' is-current':''));});
    if(countEl)countEl.textContent=String(done);
  }
  lis.forEach(function(li,i){
    var btn=li.querySelector('.btn-done');
    if(!btn)return;
    btn.addEventListener('click',function(){
      var done=getDone();
      if(i!==done)return;
      var card=li.querySelector('.step');
      var mile=(card.getAttribute('data-t')||'').indexOf('t-mile')>-1;
      done+=1;setDone(done);
      if(done>=total){fanfare();}else if(mile){fanfare();}else{ding();}
      render(done,i);
      var target=done<total?lis[done]:outro;
      if(target)setTimeout(function(){var hdr=document.querySelector('.progress');var off=(hdr&&hdr.offsetHeight?hdr.offsetHeight:0)+16;var y=target.getBoundingClientRect().top+window.pageYOffset-off;window.scrollTo({top:y<0?0:y,behavior:reduce?'auto':'smooth'});},320);
    });
  });
  var so=document.querySelector('.startover');
  if(so)so.addEventListener('click',function(){try{localStorage.removeItem('done:'+location.pathname);}catch(e){}setDone(0);render(0,-1);location.reload();});
  /* ---- copy ---- */
  function doCopy(text,btn){function ok(){tickSnd();btn.textContent='Copied';btn.classList.add('did');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('did');},2000);}function fb(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}ta.remove();}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fb);}else{fb();}}
  window.cp=function(b){var pre=b.parentNode.querySelector('pre');doCopy(pre?pre.innerText:'',b);};
  [].slice.call(document.querySelectorAll('.prompt')).forEach(function(box){
    var text=box.innerText;
    var btn=document.createElement('button');btn.className='copybtn';btn.type='button';btn.textContent='Copy';
    btn.addEventListener('click',function(){doCopy(text,btn);});
    box.appendChild(btn);
  });
  render(getDone(),-1);
  window.__confetti=confetti;window.__ding=ding;
})();

</script>
<script>
/* ---- complete card ---- */
(function(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap=document.getElementById('outro');
  if(!wrap)return;
  var btn=wrap.querySelector('.cblock-btn');
  if(!btn)return;
  var key='done:'+location.pathname;
  function markDone(){
    btn.textContent='Completed';
    btn.classList.add('is-done');
    btn.disabled=true;
    wrap.classList.add('is-done');
  }
  try{if(localStorage.getItem(key)==='1')markDone();}catch(e){}
  btn.addEventListener('click',function(){
    try{localStorage.setItem(key,'1');}catch(e){}
    markDone();
    try{if(!reduce&&window.__confetti)window.__confetti();if(window.__ding)window.__ding();}catch(e){}
  });
})();
</script>
<script src="/nav.js" defer></script>
</body>
