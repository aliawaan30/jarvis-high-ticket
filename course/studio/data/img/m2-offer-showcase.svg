<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Arial,sans-serif"><rect width="1200" height="640" rx="12" fill="white"/><text x="60" y="54" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#0e1016">One AI offer, written out in full</text><text x="60" y="84" font-size="18" fill="#5a5d6b">Six lines. One clear offer.</text><text x="60" y="150" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">NICHE</text><text x="340" y="152" font-size="23" fill="#0e1016">Roofing companies with unsold estimates</text><line x1="60" y1="177" x2="1140" y2="177" stroke="#e6e7ec"/><text x="60" y="230" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">OUTCOME</text><text x="340" y="232" font-size="23" fill="#0e1016">30 more roofing jobs a month</text><line x1="60" y1="257" x2="1140" y2="257" stroke="#e6e7ec"/><text x="60" y="310" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">TIMEFRAME</text><text x="340" y="312" font-size="23" fill="#0e1016">Monthly result target; setup agreed before launch</text><line x1="60" y1="337" x2="1140" y2="337" stroke="#e6e7ec"/><text x="60" y="390" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">RISK REVERSAL</text><text x="340" y="392" font-size="23" fill="#0e1016">We work free if we miss the agreed target</text><line x1="60" y1="417" x2="1140" y2="417" stroke="#e6e7ec"/><text x="60" y="470" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">AUTHORITY / PROOF</text><text x="340" y="472" font-size="23" fill="#0e1016">A working demo of the full follow-up process</text><line x1="60" y1="497" x2="1140" y2="497" stroke="#e6e7ec"/><text x="60" y="550" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#4b2fc4">UNIQUE MECHANISM</text><text x="340" y="552" font-size="23" fill="#0e1016">The Estimate Recovery System</text></svg>