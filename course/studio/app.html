<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Ticket Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234b2fc4'/%3E%3Crect x='9' y='9' width='14' height='2.4' rx='1.2' fill='white'/%3E%3Crect x='9' y='15' width='14' height='2.4' rx='1.2' fill='white' opacity='.7'/%3E%3Crect x='9' y='21' width='8' height='2.4' rx='1.2' fill='white' opacity='.45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#fbfbfc; --card:#ffffff; --ink:#0e1016; --ink-2:#5a5d6b; --ink-3:#8b8e9c;
  --accent:#4b2fc4; --accent-soft:#efecfb; --brass:#8a6210; --brass-soft:#f8f1df;
  --line:#e6e4ee; --line-2:#d3d0e0; --rail:#f3f2f8; --dark:#12131a; --red:#b3261e;
  --display:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.bar{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:9px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:-2px}
.bar .spacer{flex:1}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.pill b{color:var(--accent);font-weight:500}
.tabs{display:flex;background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:transparent;border-radius:6px;padding:5px 14px;font-size:13px;
  font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);
  box-shadow:0 1px 2px rgba(14,16,22,.1)}
.tool{border:1px solid var(--line-2);background:var(--card);border-radius:7px;padding:6px 12px;
  font-size:13px;font-weight:500;color:var(--ink-2)}
.tool:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:286px 1fr;height:calc(100% - 54px)}
body.focus .shell{grid-template-columns:0 1fr}
body.focus .rail{display:none}

/* ---------- rail ---------- */
.rail{background:var(--rail);border-right:1px solid var(--line);overflow:auto;padding:14px 0 60px}
.railhead{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:0 16px 10px}
.mod{margin-bottom:4px}
.mhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px 4px 16px}
.mnum{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.mname{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.25;
  padding:0 16px 6px;outline:none}
.mname:focus{background:var(--card);border-radius:4px;box-shadow:0 0 0 2px var(--accent-soft)}
.les{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 16px;font-size:13.5px;
  color:var(--ink-2);border-left:2px solid transparent}
.les:hover{background:#eceaf4}
.les[aria-current=true]{background:var(--card);border-left-color:var(--accent);color:var(--ink);font-weight:500}
.les .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:16px;flex:0 0 16px}
.les[aria-current=true] .n{color:var(--accent)}
.les .t{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les .mark{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex:0 0 6px}
.les.written .mark{background:var(--accent)}
.les.sketched .mark{background:var(--brass)}
.acts{display:none;gap:2px}
.les:hover .acts{display:flex}
.acts button{border:0;background:transparent;padding:2px 4px;font-size:11px;color:var(--ink-3);line-height:1}
.acts button:hover{color:var(--accent)}
.acts button.del:hover{color:var(--red)}
.addles{display:block;width:calc(100% - 32px);margin:4px 16px 10px;border:1px dashed var(--line-2);
  background:transparent;border-radius:6px;padding:5px;font-size:12px;color:var(--ink-3)}
.addles:hover{border-color:var(--accent);color:var(--accent)}
.addmod{display:block;width:calc(100% - 32px);margin:16px;border:1px solid var(--line-2);
  background:var(--card);border-radius:7px;padding:8px;font-size:13px;font-weight:500;color:var(--ink-2)}

/* ---------- stage ---------- */
.stage{overflow:auto;position:relative}
.pane{display:none}
.pane.on{display:block}

/* writing toolbar */
.wbar{position:sticky;top:0;z-index:30;background:rgba(251,251,252,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 0}
.wbar .inner{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:0 24px}
.wbar button{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;white-space:nowrap;
  font-size:13px;color:var(--ink-2);line-height:1.2}
.wbar button:hover{background:var(--card);border-color:var(--line)}
.wbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.wbar .b-ital{font-style:italic}
.wbar .b-bold{font-weight:700}
.wbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* the page */
.page{max-width:820px;margin:0 auto;padding:46px 24px 160px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px}
[contenteditable]{outline:none}
.ttl,.lede,.body,.deliv>div{position:relative}
.is-empty:before{content:attr(data-ph);color:var(--ink-3);pointer-events:none;
  font-style:normal;position:absolute;top:0;left:0;right:0}
.lede.is-empty:before{left:16px}
.ttl{font-family:var(--display);font-size:clamp(30px,4.6vw,46px);font-weight:600;line-height:1.08;
  letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
.lede{font-family:var(--sans);font-size:19px;font-style:normal;line-height:1.5;color:var(--ink-2);
  border-left:3px solid var(--accent);padding-left:16px;margin:0 0 26px}
.deliv{background:var(--brass-soft);border:1px solid #ecdcb8;border-radius:10px;padding:13px 16px;margin:0 0 34px}
.dlabel{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);margin-bottom:5px}
.deliv>div{font-size:15.5px;line-height:1.5}
.body{font-size:17.5px;line-height:1.68;min-height:50vh}
.body>*:first-child{margin-top:0}
.body p{margin:0 0 1.05em}
.body h2{font-family:var(--display);font-size:27px;font-weight:600;letter-spacing:-.015em;
  line-height:1.2;margin:1.9em 0 .5em;text-wrap:balance}
.body h3{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--accent);margin:1.8em 0 .5em}
.body ul,.body ol{margin:0 0 1.1em;padding-left:1.3em}
.body li{margin:0 0 .42em}
.body blockquote{margin:1.4em 0;padding:0 0 0 20px;border-left:3px solid var(--line-2);
  font-family:var(--display);font-size:20px;font-style:italic;color:var(--ink-2)}
.body hr{border:0;height:1px;background:var(--line);margin:2.4em 0}
.body a{color:var(--accent)}
.body .b-prompt{background:var(--dark);color:#e9e9f1;border-radius:10px;padding:34px 20px 18px;
  margin:1.5em 0;font-family:var(--mono);font-size:14px;line-height:1.62;white-space:pre-wrap;position:relative}
.body .b-prompt:before{content:'PASTE INTO JARVIS';position:absolute;top:12px;left:20px;
  font-size:9px;letter-spacing:.16em;color:#8e8ca8}
.body .b-note{background:var(--brass-soft);border:1px solid #ecdcb8;border-radius:10px;
  padding:30px 18px 16px;margin:1.5em 0;font-size:16px;position:relative}
.body .b-note:before{content:'NOTE';position:absolute;top:11px;left:18px;font-family:var(--mono);
  font-size:9px;letter-spacing:.16em;color:var(--brass)}
.body .b-ex{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:30px 18px 16px;margin:1.5em 0;font-size:16px;position:relative}
.body .b-ex:before{content:'WORKED EXAMPLE';position:absolute;top:11px;left:18px;font-family:var(--mono);
  font-size:9px;letter-spacing:.16em;color:var(--accent)}
.body figure.fig{margin:2em 0;padding:0}
.body figure.fig img,.body figure.fig svg{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.body figure.fig figcaption{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-3);margin:10px 2px 0}
.body table.tbl{width:100%;border-collapse:collapse;margin:1.6em 0;font-size:15.5px}
.body table.tbl th{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line-2)}
.body table.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.body .b-script{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:10px;padding:34px 20px 16px;margin:1.6em 0;position:relative}
.body .b-script:before{content:'SAY THIS';position:absolute;top:11px;left:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--brass)}
.body .b-script p{margin:0 0 .8em}


/* ---------- sketch ---------- */
.sbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:8px 18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sbar .grp{display:flex;gap:3px;background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:2px}
.sbar .grp button{border:0;background:transparent;border-radius:6px;padding:5px 9px;font-size:12.5px;color:var(--ink-2)}
.sbar .grp button[aria-pressed=true]{background:var(--card);color:var(--accent);font-weight:600;
  box-shadow:0 1px 2px rgba(14,16,22,.1)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line-2);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.wd{width:30px;height:26px;border:0;background:transparent;display:grid;place-items:center}
.wd span{display:block;width:16px;border-radius:2px;background:var(--ink-2)}
.wd[aria-pressed=true] span{background:var(--accent)}
.boardwrap{padding:22px;overflow:auto}
.board{background:var(--card);border:1px solid var(--line);border-radius:12px;display:block;
  width:100%;max-width:1600px;height:auto;margin:0 auto;
  box-shadow:0 1px 3px rgba(14,16,22,.05);touch-action:none}
.board.pen{cursor:crosshair}
.hint{max-width:1600px;margin:14px auto 40px;font-size:12.5px;color:var(--ink-3);text-align:center}
#tin{position:absolute;display:none;font-family:var(--sans);font-size:17px;border:1px solid var(--accent);
  border-radius:6px;padding:4px 7px;background:var(--card);z-index:50;min-width:160px}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">High Ticket Studio<small id="docname">Course authoring</small></div>
  <div class="tabs" role="tablist">
    <button id="tab-write" role="tab" aria-selected="true">Write</button>
    <button id="tab-sketch" role="tab" aria-selected="false">Sketch</button>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="count">0 words</div>
  <div class="pill" id="status">Ready</div>
  <button class="tool" id="btn-focus">Focus</button>
  <button class="tool" id="btn-export">Export</button>
</header>

<div class="shell">
  <aside class="rail">
    <div class="railhead">Modules</div>
    <div id="rail"></div>
    <button class="addmod" id="btn-addmod">+ New module</button>
  </aside>

  <main class="stage" id="stage">

    <section class="pane on" id="pane-write">
      <div class="wbar"><div class="inner">
        <button data-cmd="p" class="lab">Body</button>
        <button data-cmd="h2" style="font-family:var(--display);font-weight:600">Heading</button>
        <button data-cmd="h3" class="lab">Label</button>
        <span class="sep"></span>
        <button data-cmd="bold" class="b-bold">B</button>
        <button data-cmd="italic" class="b-ital">I</button>
        <span class="sep"></span>
        <button data-cmd="ul">&bull; List</button>
        <button data-cmd="ol">1. List</button>
        <button data-cmd="quote">&ldquo; Quote</button>
        <span class="sep"></span>
        <button data-cmd="prompt">Prompt box</button>
        <button data-cmd="note">Note</button>
        <button data-cmd="ex">Example</button>
        <button data-cmd="hr">Divider</button>
        <span class="sep"></span>
        <button data-cmd="clean">Clear format</button>
      </div></div>

      <article class="page">
        <div class="kick" id="kick">&nbsp;</div>
        <h1 class="ttl" id="f-title" contenteditable spellcheck="true" data-ph="Lesson title"></h1>
        <div class="lede" id="f-lede" contenteditable spellcheck="true" data-ph="One line: what this lesson promises"></div>
        <div class="deliv">
          <span class="dlabel">By the end you will have</span>
          <div id="f-deliv" contenteditable spellcheck="true" data-ph="The one thing they have in their hands at the end"></div>
        </div>
        <div class="body" id="f-body" contenteditable spellcheck="true" data-ph="Start writing. Cmd+Enter steps out of a box."></div>
      </article>
    </section>

    <section class="pane" id="pane-sketch">
      <div class="sbar">
        <div class="grp" id="tools">
          <button data-tool="select" aria-pressed="true">Move</button>
          <button data-tool="pen" aria-pressed="false">Pen</button>
          <button data-tool="rect" aria-pressed="false">Box</button>
          <button data-tool="ellipse" aria-pressed="false">Oval</button>
          <button data-tool="arrow" aria-pressed="false">Arrow</button>
          <button data-tool="line" aria-pressed="false">Line</button>
          <button data-tool="text" aria-pressed="false">Text</button>
          <button data-tool="erase" aria-pressed="false">Erase</button>
        </div>
        <div class="grp" id="colors"></div>
        <div class="grp" id="widths">
          <button class="wd" data-w="2" aria-pressed="true"><span style="height:2px"></span></button>
          <button class="wd" data-w="4" aria-pressed="false"><span style="height:4px"></span></button>
          <button class="wd" data-w="8" aria-pressed="false"><span style="height:8px"></span></button>
        </div>
        <div class="spacer" style="flex:1"></div>
        <button class="tool" id="s-undo">Undo</button>
        <button class="tool" id="s-clear">Clear board</button>
      </div>
      <div class="boardwrap">
        <svg class="board" id="board" width="1600" height="1100" viewBox="0 0 1600 1100"
             xmlns="http://www.w3.org/2000/svg"></svg>
        <p class="hint">Drag to draw. With Move selected, drag a shape to reposition it, or click it and
          press Delete. Everything saves itself, and a picture of the board lands in
          studio/data/sketches so it can be shared.</p>
      </div>
      <input id="tin" placeholder="type, then Enter">
    </section>

  </main>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const SVGNS = 'http://www.w3.org/2000/svg';

/* ============================ state ============================ */
let OUT = {title:'', modules:[]};
let cur = null;                 // {mid, lid}
let doc = {title:'',lede:'',deliverable:'',body:'',shapes:[]};
let saveT = null, outT = null, shapesTouched = false;

async function api(path, opts){
  const r = await fetch(path, opts || {});
  if(!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}
function status(txt, accent){
  $('#status').innerHTML = accent ? '<b>'+txt+'</b>' : txt;
}
function clock(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

/* ============================ rail ============================ */
function renderRail(){
  const wrap = $('#rail');
  wrap.textContent = '';
  OUT.modules.forEach((m, mi) => {
    const mod = document.createElement('div');
    mod.className = 'mod';
    const head = document.createElement('div');
    head.className = 'mhead';
    const num = document.createElement('span');
    num.className = 'mnum';
    num.textContent = m.num || ('Module ' + (mi+1));
    if(m.review_status && ['done','testing'].includes(m.review_status.state)){
      const badge=document.createElement('span');badge.className='module-status '+m.review_status.state;
      badge.textContent=(m.review_status.state==='done'?'✓ ':'● ')+m.review_status.label;
      badge.style.cssText='margin-left:7px;font-size:10px;letter-spacing:0;text-transform:none;color:'+(m.review_status.state==='done'?'#42bc89':'#e4a64e');num.appendChild(badge);
    }
    head.appendChild(num);
    mod.appendChild(head);

    const name = document.createElement('div');
    name.className = 'mname';
    name.contentEditable = 'true';
    name.spellcheck = true;
    name.textContent = m.name || 'Untitled module';
    name.addEventListener('blur', () => {
      m.name = name.textContent.trim() || 'Untitled module';
      queueOutline();
    });
    name.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); name.blur(); }
    });
    mod.appendChild(name);

    m.lessons.forEach((les, li) => {
      const row = document.createElement('div');
      row.className = 'les' + (les.written ? ' written' : '') + (les.sketched ? ' sketched' : '');
      if(cur && cur.lid === les.id) row.setAttribute('aria-current','true');
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = (li+1);
      const t = document.createElement('span');
      t.className = 't'; t.textContent = les.title || 'Untitled lesson';
      t.title = les.title || '';
      t.addEventListener('click', () => openLesson(mi, les.id));
      const mk = document.createElement('span');
      mk.className = 'mark';
      const acts = document.createElement('span');
      acts.className = 'acts';
      acts.appendChild(mkBtn('↑','Move up', () => moveLesson(mi, li, -1)));
      acts.appendChild(mkBtn('↓','Move down', () => moveLesson(mi, li, 1)));
      acts.appendChild(mkBtn('⧉','Duplicate', () => dupLesson(mi, li)));
      const del = mkBtn('×','Delete', () => delLesson(mi, li));
      del.className = 'del';
      acts.appendChild(del);
      row.append(n, t, mk, acts);
      mod.appendChild(row);
    });

    const add = document.createElement('button');
    add.className = 'addles';
    add.textContent = '+ Lesson';
    add.addEventListener('click', () => addLesson(mi));
    mod.appendChild(add);
    wrap.appendChild(mod);
  });
}
function mkBtn(label, title, fn){
  const b = document.createElement('button');
  b.textContent = label; b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(); });
  return b;
}

/* ============================ outline edits ============================ */
function newId(slug){
  return (slug || 'm') + '-' + Date.now().toString(36).slice(-5) +
         Math.floor(Math.random()*36).toString(36);
}
async function addLesson(mi){
  const m = OUT.modules[mi];
  const les = {id:newId(m.slug), title:'Untitled lesson'};
  m.lessons.push(les);
  await saveOutline();
  renderRail();
  openLesson(mi, les.id);
}
async function dupLesson(mi, li){
  const m = OUT.modules[mi];
  const src = m.lessons[li];
  const d = await api('/api/lesson?id=' + encodeURIComponent(src.id));
  const les = {id:newId(m.slug), title:(src.title || 'Untitled') + ' (copy)'};
  m.lessons.splice(li+1, 0, les);
  await api('/api/lesson?id=' + encodeURIComponent(les.id), {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:les.title, lede:d.lede||'', deliverable:d.deliverable||'',
                         body:d.body||'', shapes:d.shapes||[]})
  });
  await saveOutline(); renderRail();
}
async function moveLesson(mi, li, dir){
  const ls = OUT.modules[mi].lessons;
  const to = li + dir;
  if(to < 0 || to >= ls.length) return;
  const [x] = ls.splice(li, 1);
  ls.splice(to, 0, x);
  await saveOutline(); renderRail(); setKick();
}
async function delLesson(mi, li){
  const les = OUT.modules[mi].lessons[li];
  if(!confirm('Delete "' + (les.title||'Untitled') + '" and everything written in it?')) return;
  OUT.modules[mi].lessons.splice(li, 1);
  await api('/api/delete-lesson?id=' + encodeURIComponent(les.id), {method:'POST'});
  await saveOutline();
  if(cur && cur.lid === les.id){
    const first = firstLesson();
    if(first) openLesson(first.mi, first.id); else { cur = null; renderRail(); }
  } else { renderRail(); }
}
async function addModule(){
  const n = OUT.modules.length + 1;
  OUT.modules.push({slug:'m'+n, num:'Module '+n, name:'Untitled module', blurb:'', lessons:[]});
  await saveOutline(); renderRail();
}
function firstLesson(){
  for(let mi=0; mi<OUT.modules.length; mi++){
    if(OUT.modules[mi].lessons.length) return {mi, id:OUT.modules[mi].lessons[0].id};
  }
  return null;
}
function queueOutline(){
  clearTimeout(outT);
  outT = setTimeout(saveOutline, 500);
}
async function saveOutline(){
  await api('/api/outline', {method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(OUT)});
}

/* ============================ lesson load / save ============================ */
function emptyCheck(el){
  const txt = el.textContent.replace(/​/g,'').trim();
  const hasBlocks = el.querySelector('ul,ol,hr,div,blockquote,h2,h3,img');
  el.classList.toggle('is-empty', txt === '' && !hasBlocks);
}
function setKick(){
  if(!cur){ $('#kick').textContent = ''; return; }
  const m = OUT.modules[cur.mi];
  const li = m.lessons.findIndex(l => l.id === cur.lid);
  $('#kick').textContent = (m.num || '') + ' · ' + (m.name || '') +
    ' · Lesson ' + (li+1) + ' of ' + m.lessons.length;
  $('#docname').textContent = (m.num || '') + ' / lesson ' + (li+1);
}
async function openLesson(mi, lid){
  if(cur) await saveLesson(true);
  cur = {mi, lid};
  localStorage.setItem('studio.last', mi + '|' + lid);
  const d = await api('/api/lesson?id=' + encodeURIComponent(lid));
  doc = {title:d.title||'', lede:d.lede||'', deliverable:d.deliverable||'',
         body:d.body||'', shapes:Array.isArray(d.shapes)?d.shapes:[]};
  $('#f-title').textContent = doc.title;
  $('#f-lede').textContent = doc.lede;
  $('#f-deliv').textContent = doc.deliverable;
  $('#f-body').innerHTML = doc.body;
  ['#f-title','#f-lede','#f-deliv','#f-body'].forEach(s => emptyCheck($(s)));
  SK.shapes = doc.shapes; SK.sel = null; SK.undo = [];
  shapesTouched = false;
  drawBoard();
  setKick(); renderRail(); words();
  status('Ready');
  $('#stage').scrollTop = 0;
}
function collect(){
  tidy();
  return {
    title: $('#f-title').textContent.trim(),
    lede: $('#f-lede').textContent.trim(),
    deliverable: $('#f-deliv').textContent.trim(),
    body: $('#f-body').classList.contains('is-empty') ? '' : $('#f-body').innerHTML,
    shapes: SK.shapes
  };
}
function queueSave(){
  if(!cur) return;
  status('Editing');
  clearTimeout(saveT);
  saveT = setTimeout(() => saveLesson(false), 700);
}
async function saveLesson(silent){
  if(!cur) return;
  clearTimeout(saveT);
  const payload = collect();
  const m = OUT.modules[cur.mi];
  const les = m.lessons.find(l => l.id === cur.lid);
  let outlineDirty = false;
  const newTitle = payload.title || 'Untitled lesson';
  if(les && les.title !== newTitle){ les.title = newTitle; outlineDirty = true; }
  const written = !!payload.body.trim();
  const sketched = payload.shapes.length > 0;
  if(les && (!!les.written !== written || !!les.sketched !== sketched)){
    les.written = written; les.sketched = sketched; outlineDirty = true;
  }
  if(shapesTouched){
    const png = await boardPng();
    if(png) payload.png = png;
    shapesTouched = false;
  }
  await api('/api/lesson?id=' + encodeURIComponent(cur.lid), {
    method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if(outlineDirty){ await saveOutline(); renderRail(); setKick(); }
  if(!silent) status('Saved ' + clock());
}

function words(){
  const txt = ($('#f-body').textContent || '').trim();
  const n = txt ? txt.split(/\s+/).length : 0;
  const mins = Math.max(1, Math.round(n/210));
  $('#count').textContent = n ? (n.toLocaleString() + ' words · ' + mins + ' min read') : '0 words';

/* ============================ writing commands ============================ */
document.execCommand('defaultParagraphSeparator', false, 'p');
const BODY = $('#f-body');
const BOXRE = /b-prompt|b-note|b-ex/;
const BLOCKTAGS = /^(P|H1|H2|H3|UL|OL|HR|BLOCKQUOTE|DIV|PRE|FIGURE|TABLE)$/;

function caretIn(node, atEnd){
  if(!node) return;
  const r = document.createRange();
  r.selectNodeContents(node);
  r.collapse(!atEnd);
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(r);
}
/* Everything the toolbar does needs a real block to stand on. Typing straight
   into a contenteditable gives you a bare text node, and formatBlock quietly
   fails on one while insertHTML turns a div into an inline span. */
function ensureBlock(){
  const only = BODY.childNodes.length === 1 && BODY.firstChild.nodeName === 'BR';
  if(!BODY.firstChild || only){
    BODY.innerHTML = '<p><br></p>';
    caretIn(BODY.firstChild);
    return;
  }
  let run = [];
  const flush = () => {
    if(!run.length) return;
    const p = document.createElement('p');
    run[0].before(p);
    run.forEach(n => p.appendChild(n));
    run = [];
  };
  Array.from(BODY.childNodes).forEach(n => {
    const inline = n.nodeType === 3 || (n.nodeType === 1 && !BLOCKTAGS.test(n.nodeName));
    if(inline){
      if(n.nodeType === 3 && !n.textContent.trim()){ return; }
      run.push(n);
    } else { flush(); }
  });
  flush();
}
function topBlock(){
  const s = window.getSelection();
  let n = s && s.rangeCount ? s.anchorNode : null;
  if(!n || !BODY.contains(n)) return BODY.lastElementChild;
  while(n && n.parentNode !== BODY) n = n.parentNode;
  return (n && n.nodeType === 1) ? n : BODY.lastElementChild;
}
function boxAround(){
  let n = window.getSelection().anchorNode;
  while(n && n !== BODY){
    if(n.nodeType === 1 && BOXRE.test(n.className || '')) return n;
    n = n.parentNode;
  }
  return null;
}
function setBlock(tag){
  ensureBlock();
  const b = topBlock();
  if(!b) return;
  if(b.nodeName.toLowerCase() === tag){
    if(tag === 'p') return;
    return setBlock('p');
  }
  const next = document.createElement(tag);
  next.innerHTML = b.innerHTML || '<br>';
  b.replaceWith(next);
  caretIn(next, true);
}
function insertBox(cls){
  ensureBlock();
  const sel = window.getSelection();
  const picked = (sel && !sel.isCollapsed) ? sel.toString().trim() : '';
  const b = topBlock();
  const box = document.createElement('div');
  box.className = cls;
  if(picked) box.textContent = picked; else box.appendChild(document.createElement('br'));
  const after = document.createElement('p');
  after.innerHTML = '<br>';
  if(b){ b.after(box); box.after(after); } else { BODY.append(box, after); }
  if(picked && b && b.textContent.trim() === picked) b.remove();
  caretIn(box, true);
}
function insertRule(){
  ensureBlock();
  const b = topBlock();
  const hr = document.createElement('hr');
  const p = document.createElement('p');
  p.innerHTML = '<br>';
  if(b){ b.after(hr); hr.after(p); } else { BODY.append(hr, p); }
  caretIn(p);
}
/* Chrome sometimes leaves a list or a box nested inside a paragraph. Invalid
   html there would break the page builder later, so straighten it before save. */
function tidy(){
  BODY.querySelectorAll('p > ul, p > ol, p > div, p > hr, p > blockquote').forEach(n => {
    const par = n.parentNode;
    par.before(n);
    if(!par.textContent.trim() && !par.querySelector('ul,ol,div,hr,blockquote')) par.remove();
  });
  const blank = e => e && e.nodeName === 'P' && !e.textContent.trim();
  while(BODY.children.length > 1 && blank(BODY.lastElementChild) &&
        blank(BODY.lastElementChild.previousElementSibling)){
    BODY.lastElementChild.remove();
  }
}

const CMDS = {
  p: () => setBlock('p'),
  h2: () => setBlock('h2'),
  h3: () => setBlock('h3'),
  quote: () => setBlock('blockquote'),
  bold: () => document.execCommand('bold'),
  italic: () => document.execCommand('italic'),
  ul: () => { ensureBlock(); document.execCommand('insertUnorderedList'); tidy(); },
  ol: () => { ensureBlock(); document.execCommand('insertOrderedList'); tidy(); },
  hr: insertRule,
  prompt: () => insertBox('b-prompt'),
  note: () => insertBox('b-note'),
  ex: () => insertBox('b-ex'),
  clean: () => { document.execCommand('removeFormat'); setBlock('p'); }
};

let lastRange = null;
document.addEventListener('selectionchange', () => {
  const s = window.getSelection();
  if(s.rangeCount && BODY.contains(s.anchorNode)) lastRange = s.getRangeAt(0).cloneRange();
});
function restoreCaret(){
  const s = window.getSelection();
  if(s.rangeCount && BODY.contains(s.anchorNode)) return;
  BODY.focus();
  if(lastRange){ s.removeAllRanges(); s.addRange(lastRange); }
  else { ensureBlock(); caretIn(BODY.lastElementChild, true); }
}
$$('.wbar button').forEach(b => {
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => {
    restoreCaret();
    (CMDS[b.dataset.cmd] || (() => {}))();
    emptyCheck(BODY); words(); queueSave();
  });
});

/* field wiring */
['#f-title','#f-lede','#f-deliv','#f-body'].forEach(s => {
  const el = $(s);
  el.addEventListener('input', () => { emptyCheck(el); if(s === '#f-body') words(); queueSave(); });
  el.addEventListener('blur', () => saveLesson(false));
  el.addEventListener('paste', e => {
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
    if(s === '#f-body'){
      ensureBlock();
      const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(boxAround()){
        document.execCommand('insertText', false, txt);
      } else {
        const html = txt.split(/\n{2,}/).map(par =>
          '<p>' + esc(par).replace(/\n/g,'<br>') + '</p>').join('');
        document.execCommand('insertHTML', false, html);
      }
    } else {
      document.execCommand('insertText', false, txt.replace(/\s+/g,' ').trim());
    }
    emptyCheck(el); words(); queueSave();
  });
});
BODY.addEventListener('focus', ensureBlock);
$('#f-title').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); $('#f-lede').focus(); }
});
$('#f-lede').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); $('#f-deliv').focus(); }
});
$('#f-deliv').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); BODY.focus(); }
});
BODY.addEventListener('keydown', e => {
  /* Cmd+Enter steps out of a prompt or note box and starts a fresh paragraph. */
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    e.preventDefault();
    const box = boxAround() || topBlock();
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    if(box) box.after(p); else BODY.appendChild(p);
    caretIn(p);
    queueSave();
    return;
  }
  /* Enter inside a box breaks the line instead of splitting the box in two. */
  if(e.key === 'Enter' && !e.shiftKey && boxAround()){
    e.preventDefault();
    document.execCommand('insertLineBreak');
    queueSave();
  }
});

/* ============================ sketch board ============================ */
const PAL = [['Ink','#0e1016'],['Violet','#4b2fc4'],['Brass','#8a6210'],
             ['Red','#b3261e'],['Green','#1d7a4c'],['Sky','#1f6feb']];
const SK = {shapes:[], tool:'select', color:'#0e1016', w:2, sel:null, undo:[], drag:null, draft:null};

(function buildPal(){
  const wrap = $('#colors');
  PAL.forEach(([name, hex], i) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.title = name; b.style.background = hex;
    b.setAttribute('aria-pressed', i === 0);
    b.addEventListener('click', () => {
      SK.color = hex;
      $$('#colors .sw').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    wrap.appendChild(b);
  });
})();
$$('#tools button').forEach(b => b.addEventListener('click', () => {
  SK.tool = b.dataset.tool;
  $$('#tools button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#board').classList.toggle('pen', SK.tool !== 'select');
  SK.sel = null; drawBoard();
}));
$$('#widths button').forEach(b => b.addEventListener('click', () => {
  SK.w = +b.dataset.w;
  $$('#widths button').forEach(x => x.setAttribute('aria-pressed', x === b));
}));
$('#s-undo').addEventListener('click', () => {
  if(!SK.undo.length) return;
  SK.shapes = JSON.parse(SK.undo.pop());
  SK.sel = null; drawBoard(); touchShapes();
});
$('#s-clear').addEventListener('click', () => {
  if(!SK.shapes.length) return;
  if(!confirm('Clear the whole board for this lesson?')) return;
  pushUndo(); SK.shapes = []; SK.sel = null; drawBoard(); touchShapes();
});
function pushUndo(){
  SK.undo.push(JSON.stringify(SK.shapes));
  if(SK.undo.length > 60) SK.undo.shift();
}
function touchShapes(){ shapesTouched = true; queueSave(); }

function pt(e){
  const r = $('#board').getBoundingClientRect();
  return {x: Math.round((e.clientX - r.left) * 1600 / r.width),
          y: Math.round((e.clientY - r.top) * 1100 / r.height)};
}
function bbox(s){
  if(s.t === 'pen'){
    const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
    return {x:Math.min(...xs), y:Math.min(...ys),
            w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)};
  }
  if(s.t === 'rect') return {x:s.x, y:s.y, w:s.w, h:s.h};
  if(s.t === 'ellipse') return {x:s.cx-s.rx, y:s.cy-s.ry, w:s.rx*2, h:s.ry*2};
  if(s.t === 'text') return {x:s.x-4, y:s.y-s.size, w:Math.max(40, s.s.length*s.size*0.55), h:s.size*1.35};
  return {x:Math.min(s.x1,s.x2), y:Math.min(s.y1,s.y2),
          w:Math.abs(s.x2-s.x1), h:Math.abs(s.y2-s.y1)};
}
function hit(p){
  for(let i = SK.shapes.length-1; i >= 0; i--){
    const b = bbox(SK.shapes[i]), pad = 10;
    if(p.x >= b.x-pad && p.x <= b.x+b.w+pad && p.y >= b.y-pad && p.y <= b.y+b.h+pad) return i;
  }
  return -1;
}
function move(s, dx, dy){
  if(s.t === 'pen'){ s.pts = s.pts.map(([x,y]) => [x+dx, y+dy]); return; }
  if(s.t === 'rect'){ s.x += dx; s.y += dy; return; }
  if(s.t === 'ellipse'){ s.cx += dx; s.cy += dy; return; }
  if(s.t === 'text'){ s.x += dx; s.y += dy; return; }
  s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy;
}
function el(name, attrs){
  const n = document.createElementNS(SVGNS, name);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function shapeNode(s){
  const base = {stroke:s.c, 'stroke-width':s.sw || 2, fill:'none',
                'stroke-linecap':'round', 'stroke-linejoin':'round'};
  if(s.t === 'pen'){
    const d = s.pts.map((p,i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
    return el('path', Object.assign({d}, base));
  }
  if(s.t === 'rect') return el('rect', Object.assign({x:Math.min(s.x, s.x+s.w),
      y:Math.min(s.y, s.y+s.h), width:Math.abs(s.w), height:Math.abs(s.h), rx:6}, base));
  if(s.t === 'ellipse') return el('ellipse', Object.assign({cx:s.cx, cy:s.cy,
      rx:Math.abs(s.rx), ry:Math.abs(s.ry)}, base));
  if(s.t === 'line') return el('line', Object.assign({x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2}, base));
  if(s.t === 'arrow'){
    const g = el('g', {});
    g.appendChild(el('line', Object.assign({x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2}, base)));
    const a = Math.atan2(s.y2-s.y1, s.x2-s.x1), L = 14 + (s.sw||2)*2.6, sp = 0.42;
    const p1 = [s.x2 - L*Math.cos(a-sp), s.y2 - L*Math.sin(a-sp)];
    const p2 = [s.x2 - L*Math.cos(a+sp), s.y2 - L*Math.sin(a+sp)];
    g.appendChild(el('polygon', {points:[[s.x2,s.y2],p1,p2].map(q => q.join(',')).join(' '),
      fill:s.c, stroke:'none'}));
    return g;
  }
  if(s.t === 'text'){
    const n = el('text', {x:s.x, y:s.y, fill:s.c, 'font-size':s.size,
      'font-family':'Helvetica, Arial, sans-serif', 'font-weight':'500'});
    n.textContent = s.s;
    return n;
  }
  return el('g', {});
}
function drawBoard(){
  const b = $('#board');
  b.textContent = '';
  SK.shapes.forEach(s => b.appendChild(shapeNode(s)));
  if(SK.draft) b.appendChild(shapeNode(SK.draft));
  if(SK.sel !== null && SK.shapes[SK.sel]){
    const bb = bbox(SK.shapes[SK.sel]);
    const r = el('rect', {x:bb.x-8, y:bb.y-8, width:bb.w+16, height:bb.h+16, rx:5,
      fill:'none', stroke:'#4b2fc4', 'stroke-width':1.5, 'stroke-dasharray':'5 4'});
    r.setAttribute('class','selbox');
    b.appendChild(r);
  }
}

const board = $('#board');
board.addEventListener('pointerdown', e => {
  const p = pt(e);
  if(SK.tool === 'text'){
    const i = $('#tin');
    const r = board.getBoundingClientRect();
    i.style.display = 'block';
    i.style.left = (e.clientX + window.scrollX) + 'px';
    i.style.top = (e.clientY + window.scrollY - 14) + 'px';
    i.value = '';
    i.dataset.x = p.x; i.dataset.y = p.y;
    setTimeout(() => i.focus(), 0);
    return;
  }
  if(SK.tool === 'erase'){
    const i = hit(p);
    if(i >= 0){ pushUndo(); SK.shapes.splice(i,1); SK.sel = null; drawBoard(); touchShapes(); }
    return;
  }
  if(SK.tool === 'select'){
    const i = hit(p);
    SK.sel = i >= 0 ? i : null;
    if(i >= 0){ pushUndo(); SK.drag = {i, x:p.x, y:p.y}; board.setPointerCapture(e.pointerId); }
    drawBoard();
    return;
  }
  board.setPointerCapture(e.pointerId);
  if(SK.tool === 'pen') SK.draft = {t:'pen', pts:[[p.x,p.y]], c:SK.color, sw:SK.w};
  else if(SK.tool === 'rect') SK.draft = {t:'rect', x:p.x, y:p.y, w:0, h:0, c:SK.color, sw:SK.w};
  else if(SK.tool === 'ellipse') SK.draft = {t:'ellipse', cx:p.x, cy:p.y, rx:0, ry:0, c:SK.color, sw:SK.w, _ox:p.x, _oy:p.y};
  else SK.draft = {t:SK.tool, x1:p.x, y1:p.y, x2:p.x, y2:p.y, c:SK.color, sw:SK.w};
});
board.addEventListener('pointermove', e => {
  const p = pt(e);
  if(SK.drag){
    const s = SK.shapes[SK.drag.i];
    move(s, p.x - SK.drag.x, p.y - SK.drag.y);
    SK.drag.x = p.x; SK.drag.y = p.y;
    drawBoard();
    return;
  }
  if(!SK.draft) return;
  const d = SK.draft;
  if(d.t === 'pen'){
    const last = d.pts[d.pts.length-1];
    if(Math.abs(last[0]-p.x) + Math.abs(last[1]-p.y) > 2) d.pts.push([p.x,p.y]);
  } else if(d.t === 'rect'){ d.w = p.x - d.x; d.h = p.y - d.y; }
  else if(d.t === 'ellipse'){
    d.cx = (d._ox + p.x)/2; d.cy = (d._oy + p.y)/2;
    d.rx = Math.abs(p.x - d._ox)/2; d.ry = Math.abs(p.y - d._oy)/2;
  } else { d.x2 = p.x; d.y2 = p.y; }
  drawBoard();
});
function endStroke(){
  if(SK.drag){ SK.drag = null; touchShapes(); return; }
  const d = SK.draft;
  SK.draft = null;
  if(!d) return;
  const b = bbox(d);
  const tiny = (d.t === 'pen' && d.pts.length < 2) ||
               (d.t !== 'pen' && b.w < 4 && b.h < 4);
  if(tiny){ drawBoard(); return; }
  delete d._ox; delete d._oy;
  pushUndo();
  SK.shapes.push(d);
  drawBoard(); touchShapes();
}
board.addEventListener('pointerup', endStroke);
board.addEventListener('pointercancel', endStroke);
board.addEventListener('pointerleave', e => { if(SK.draft || SK.drag) endStroke(); });

$('#tin').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const v = e.target.value.trim();
    if(v){
      pushUndo();
      SK.shapes.push({t:'text', x:+e.target.dataset.x, y:+e.target.dataset.y,
                      s:v, c:SK.color, size:14 + SK.w*5});
      drawBoard(); touchShapes();
    }
    e.target.style.display = 'none'; e.target.value = '';
  } else if(e.key === 'Escape'){ e.target.style.display = 'none'; }
});
$('#tin').addEventListener('blur', e => { e.target.style.display = 'none'; });

document.addEventListener('keydown', e => {
  if($('#pane-sketch').classList.contains('on') && SK.sel !== null &&
     (e.key === 'Backspace' || e.key === 'Delete') &&
     document.activeElement.tagName !== 'INPUT'){
    e.preventDefault();
    pushUndo(); SK.shapes.splice(SK.sel,1); SK.sel = null; drawBoard(); touchShapes();
  }
  if($('#pane-sketch').classList.contains('on') && (e.metaKey || e.ctrlKey) &&
     e.key.toLowerCase() === 'z'){ e.preventDefault(); $('#s-undo').click(); }
});

/* flatten the board to a png so a sketch can be shared outside the browser */
async function boardPng(){
  try{
    const svg = $('#board').cloneNode(true);
    svg.querySelectorAll('.selbox').forEach(n => n.remove());
    const bg = el('rect', {x:0, y:0, width:1600, height:1100, fill:'#ffffff'});
    svg.insertBefore(bg, svg.firstChild);
    svg.setAttribute('xmlns', SVGNS);
    const str = new XMLSerializer().serializeToString(svg);
    const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(str)));
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const c = document.createElement('canvas');
    c.width = 1600; c.height = 1100;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,1600,1100);
    ctx.drawImage(img, 0, 0);
    return c.toDataURL('image/png');
  } catch(err){ return null; }
}

/* ============================ boot ============================ */
(async function(){
  try{
    OUT = await api('/api/outline');
    if(!OUT.modules || !OUT.modules.length){ status('No outline on disk'); return; }
    renderRail();
    const last = (localStorage.getItem('studio.last') || '').split('|');
    let mi = 0, lid = null;
    if(last.length === 2){
      const m = OUT.modules[+last[0]];
      if(m && m.lessons.some(l => l.id === last[1])){ mi = +last[0]; lid = last[1]; }
    }
    if(!lid){ const f = firstLesson(); if(!f) return; mi = f.mi; lid = f.id; }
    await openLesson(mi, lid);
  } catch(err){
    status('Server not reachable');
    console.error(err);
  }
})();
