<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northpoint Physio | Physiotherapy and sports injury clinic in Dallas</title><meta name="description" content="Hands-on physiotherapy and a clear recovery plan from your first visit, in Uptown Dallas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#F3F6F4;--ink:#10201B;--mu:#51605A;--ac:#1D6A55;--deep:#0F2A22;--mint:#9FD6C2;--line:#D7E1DC;--serif:'Newsreader',Georgia,serif;--sans:'Geist',system-ui,-apple-system,sans-serif;--tab-on:#fff;--tab-bg:#1D6A55;--tab-border:#1D6A55}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:-.015em;margin:0}em{font-style:italic}h1 em,h2 em{color:var(--ac)}.dark h2 em{color:var(--mint)}
h1{font-size:clamp(56px,9vw,150px)}h2{font-size:clamp(40px,5.6vw,92px)}
a{color:inherit}.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,3vw,40px)}
.lab{display:block;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:18px}.dark .lab{color:rgba(243,246,244,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;border-radius:999px;background:var(--ac);color:#fff;font:600 15px var(--sans);text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.light{background:var(--mint);color:var(--deep)}.btn.sm{height:42px;padding:0 18px}.btn .smt{display:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}.dark :focus-visible{outline-color:var(--mint)}
.ph{position:absolute;left:14px;bottom:12px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;background:rgba(243,246,244,.88);color:#10201B;padding:5px 10px;border-radius:999px}
.hd{position:fixed;inset:0 0 auto;z-index:60;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,3vw,40px);background:rgba(243,246,244,.86);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;text-decoration:none;white-space:nowrap;color:var(--ink)}.logo svg{color:var(--ac)}
nav{display:flex;gap:26px;align-items:center;font-size:15px}nav a:not(.btn){text-decoration:none}
.hero{padding:130px 0 40px;position:relative;overflow-x:clip}.hgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:60px;align-items:center}
.lead{font-size:20px;color:var(--mu);max-width:520px;margin:26px 0 30px}.acts{display:flex;gap:12px;flex-wrap:wrap}.fine{font-size:14px;color:var(--mu);margin-top:24px}
.path{display:block;width:100%;height:90px;margin-top:30px}.path path{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:6 8}
.mq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.4vw,44px);color:var(--mu)}
.pad{padding:clamp(90px,12vw,150px) 0}.soft{background:#E9F0EC}.center{text-align:center}
.dark{background:var(--deep);color:var(--bg)}.mu{color:rgba(243,246,244,.75);font-size:18px}.mu2{color:var(--mu);font-size:18px}
.team{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px;align-items:center}.team .mu{margin-top:24px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:8px 0;box-shadow:0 10px 30px rgba(16,32,27,.08);display:flex;justify-content:space-between;gap:12px;font-size:15px}.card span{color:var(--mu);text-align:right}
footer{background:var(--deep);color:rgba(243,246,244,.8);padding:50px 0 120px;font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sticky{display:none}
@media (max-width:860px){nav a:not(.btn){display:none}.btn .lg{display:none}.btn .smt{display:inline}.logo{font-size:19px}.hd{height:64px}
 .hero{padding-top:100px}.hgrid,.team{grid-template-columns:minmax(0,1fr);gap:36px}.lead{font-size:18px}
 .sticky{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:55}.sticky .btn{flex:1}footer{padding-bottom:110px}}
