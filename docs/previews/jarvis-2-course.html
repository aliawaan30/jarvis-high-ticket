ly</h2>\n<p>Use your phone, decent light and your own voice. Speak to one owner the way you would on a call. Movement and a natural setting can make the video feel like something they would normally watch.</p>\n<p>Film the body clearly. If you want three different openings, record three hooks. Keep those clips together so Jarvis has the material to create the variations.</p>\n<h2>Edit and review</h2>\n<p>Give Jarvis the source clips and explain which takes you want used. Open the edit in your connected review workflow. Check that the opening lands, the captions match and the finished video keeps your meaning.</p>\n<div class=\"b-prompt\"><p>Edit my saved ad footage into the agreed versions using the hooks I actually recorded, then show me the exports for review.</p></div>\n<h2>Create static ads</h2>\n<p>A simple static can carry a strong offer. Use a clear headline, relevant visual and one action. Keep the ad and landing page saying the same thing.</p>\n<div class=\"b-prompt\"><p>Create static ads for my saved offer using the approved angles and brand assets.</p></div>\n<h2>Tips</h2>\n<ul><li>Keep prices for the sales conversation.</li><li>Use real demonstrations and proof you have permission to show.</li><li>Keep the angle and version attached to every creative.</li><li>Review the export before it goes into a campaign.</li></ul>\n<p>Have your first set ready to review, then use the campaign setup to put the approved ads in front of the right market.</p>", "empty": false, "guide": null}, {"id": "m4-launch-and-manage-campaigns", "mod": "Module 5", "modname": "Client Acquisition: Paid Ads", "title": "Launch and manage your campaigns", "lede": "Turn approved creative into a campaign with a budget you understand.", "body": "<p>The campaign connects your ads, offer page, audience and budget. Set it up around the result you want: suitable owners applying and booking a conversation.</p>\n<h2>Give Jarvis the decisions it needs</h2>\n<p>Use your saved offer, approved creative and funnel. Add your target location, test budget and the amount you can afford to spend to win a client. Jarvis should ask when a required decision is missing.</p>\n<div class=\"b-prompt\"><p>Prepare a Meta campaign for my saved offer and approved ads. Show me the budget, audience, destination and measurement before launch.</p></div>\n<p>Review the account, total intended spend, dates, creative and destination before you approve anything that goes live. The campaign should use the real booking event, so a page visit is not mistaken for an appointment.</p>\n<h2>Look at the whole journey</h2>\n<table class=\"tbl\"><tr><th>What happened?</th><th>What to investigate</th></tr><tr><td>People see it but do not respond.</td><td>The opening, angle and relevance.</td></tr><tr><td>People click but do not apply.</td><td>Whether the page delivers the offer the ad introduced.</td></tr><tr><td>People apply but do not book or attend.</td><td>The fit questions, booking route and preparation.</td></tr><tr><td>Calls happen but deals do not progress.</td><td>Lead quality, discovery, proposal and delivery fit.</td></tr></table>\n<p>One day of weak results can mean very little when the sample is small or deals take time. Check the actual reporting period and how many opportunities have had time to progress.</p>\n<h2>Make the next week better</h2>\n<div class=\"b-prompt\"><p>Review my campaign and CRM outcomes, explain what the evidence supports, and prepare the next creative tests and filming list for my approval.</p></div>\n<p>Jarvis should show which records support its recommendation. Approve a budget change because the economics and evidence make sense, rather than because a cheap click looks good.</p>", "empty": false, "guide": null}, {"id": "m6-one-conversation-two-calls", "mod": "Module 6", "modname": "Sales", "title": "One conversation, two calls", "lede": "Understand the business first, then present a solution you have scoped.", "body": "<!-- module-context:start -->\n<p>You are turning a business conversation into a project you can deliver. Jarvis prepares the research and preserves the discovery, while you understand the owner and agree the work.</p>\n<p>You will use discovery, technical scoping and a clear proposal to explain the solution and ask for the decision.</p>\n<!-- module-context:end -->\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDI3MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJBIGNsZWFyIHByb3Bvc2FsIHN0YXJ0cyB3aXRoIGEgY2xlYXIgcHJvYmxlbSI+PHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iMjcwIiBmaWxsPSIjZmJmYmZjIi8+PHRleHQgeD0iMzYiIHk9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNSIgZmlsbD0iIzBlMTAxNiI+QSBjbGVhciBwcm9wb3NhbCBzdGFydHMgd2l0aCBhIGNsZWFyIHByb2JsZW08L3RleHQ+PHJlY3QgeD0iMzYuMCIgeT0iNzgiIHdpZHRoPSIzNTcuMzMzMzMzMzMzMzMzMyIgaGVpZ2h0PSIxNDUiIHJ4PSIxMCIgZmlsbD0iI2VmZWNmYiIgc3Ryb2tlPSIjZDhjZmVlIi8+PHRleHQgeD0iMjE0LjY2NjY2NjY2NjY2NjY2IiB5PSIxMjUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjIyIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0iIzRiMmZjNCI+VW5kZXJzdGFuZDwvdGV4dD48dGV4dCB4PSIyMTQuNjY2NjY2NjY2NjY2NjYiIHk9IjE1OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPlByb2JsZW0gYW5kIHJlc3VsdDwvdGV4dD48dGV4dCB4PSI0MDcuMzMzMzMzMzMzMzMzMyIgeT0iMTUzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjNWE1ZDZiIj7ihpI8L3RleHQ+PHJlY3QgeD0iNDIxLjMzMzMzMzMzMzMzMzMiIHk9Ijc4IiB3aWR0aD0iMzU3LjMzMzMzMzMzMzMzMzMiIGhlaWdodD0iMTQ1IiByeD0iMTAiIGZpbGw9IiNlZmVjZmIiIHN0cm9rZT0iI2Q4Y2ZlZSIvPjx0ZXh0IHg9IjYwMC4wIiB5PSIxMjUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjIyIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0iIzRiMmZjNCI+U2NvcGU8L3RleHQ+PHRleHQgeD0iNjAwLjAiIHk9IjE1OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPlRlY2huaWNhbCByZXZpZXc8L3RleHQ+PHRleHQgeD0iNjAwLjAiIHk9IjE4NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPmFuZCBhY3R1YWwgY29zdDwvdGV4dD48dGV4dCB4PSI3OTIuNjY2NjY2NjY2NjY2NiIgeT0iMTUzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjNWE1ZDZiIj7ihpI8L3RleHQ+PHJlY3QgeD0iODA2LjY2NjY2NjY2NjY2NjYiIHk9Ijc4IiB3aWR0aD0iMzU3LjMzMzMzMzMzMzMzMzMiIGhlaWdodD0iMTQ1IiByeD0iMTAiIGZpbGw9IiNlZmVjZmIiIHN0cm9rZT0iI2Q4Y2ZlZSIvPjx0ZXh0IHg9Ijk4NS4zMzMzMzMzMzMzMzMzIiB5PSIxMjUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjIyIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0iIzRiMmZjNCI+UHJlc2VudDwvdGV4dD48dGV4dCB4PSI5ODUuMzMzMzMzMzMzMzMzMyIgeT0iMTU5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzVhNWQ2YiI+RGVtbywgcHJvcG9zYWw8L3RleHQ+PHRleHQgeD0iOTg1LjMzMzMzMzMzMzMzMzMiIHk9IjE4NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPmFuZCBkZWNpc2lvbjwvdGV4dD48L3N2Zz4=\" alt=\"Understand, scope, present\"><figcaption>The technical review happens before the custom project price is final.</figcaption></figure>\n<p>For a custom system, I recommend two calls. On the first, understand the business, the problem and what needs to change. Between calls, map the solution with the technical team. On the second, present the proposal and show how it solves the problem.</p>\n<p>A simple repeatable service can sometimes close in one call because the deliverable and price are already clear. Choose the route based on how much needs to be understood and scoped.</p>\n<h2>When they ask the price early</h2>\n<div class=\"b-script\"><p>I need to sit down with my team and map this out properly first. I want to make sure we have the right scope, know what it will take to build, and can give you a clear price and timeline. Let us get that together and take you through the proposal on [agreed day and time].</p></div>\n<p>Book the next conversation with enough time for that review. You should know who is reviewing the scope before you promise when the proposal will be ready.</p>", "empty": false, "guide": null}, {"id": "m6-call-one-find-the-pain", "mod": "Module 6", "modname": "Sales", "title": "Call one: understand the problem", "lede": "Be genuinely curious about why they booked and what needs to change.", "body": "<p>Start with a short friendly chat. Ask where they are based or how long they have run the business. Then find out why they wanted the conversation.</p>\n<div class=\"b-script\"><p>So [name], what was the main reason you booked in today? How can I help?</p></div>\n<p>Let them explain. Use the offer they responded to as context, and follow the parts that matter to their business.</p>\n<h2>Understand what is happening</h2>\n<div class=\"b-script\"><p>Talk me through what happens when [the relevant enquiry, document or job] comes in.</p><p>Where does that get held up?</p><p>Can you give me a recent example?</p></div>\n<p>If the offer is quote follow-up, understand how estimates are sent, what happens afterwards and where the owner loses visibility. You do not need to audit an unrelated part of the company.</p>\n<h2>Understand the cost of leaving it</h2>\n<div class=\"b-script\"><p>How much time is that taking the team?</p><p>What happens to the customer or job when it gets stuck there?</p><p>If that carries on for another six months, what does that mean for the business?</p></div>\n<p>Work through numbers they can support. Ask how often it happens and what each instance costs. Time saved, revenue recovered and profit are different things. If neither of you knows, keep it as a question to investigate.</p>\n<h2>Find out what a good result looks like</h2>\n<div class=\"b-script\"><p>If we fixed this properly, what would you want the process to look like?</p><p>What tools would it need to work with?</p><p>Who else needs to be involved in deciding or using it?</p></div>\n<h2>Agree what happens next</h2>\n<div class=\"b-script\"><p>Let me make sure I have this right. [Their problem] is causing [the impact they described]. You want [their desired result], and it needs to work with [their requirements]. Have I missed anything important?</p><p>I will map that with the technical team and come back with a proposal. Let us lock in [day and time] to go through it together.</p></div>\n<div class=\"b-prompt\"><p>Prepare my discovery questions from this prospect and my saved offer, then save the conversation against their deal record.</p></div>\n<p>Use the questions to understand them. Follow a useful answer rather than racing to the next line.</p>", "empty": false, "guide": null}, {"id": "m6-prescribe-the-solution", "mod": "Module 6", "modname": "Sales", "title": "Scope and price the solution", "lede": "Price a valuable result that you can deliver profitably.", "body": "<p>The owner has told you what is happening and why it matters. Now you need a solution that fits their workflow, an actual delivery cost and a price that makes sense to both sides.</p>\n<h2>Start with the change they want</h2>\n<p>Show what happens before and after the system. For the roofing example, the team can see which estimates are being followed up, which customers replied and which conversations need the roofer.</p>\n<p>Keep the proposal focused on that result. A long feature list adds very little if the owner cannot connect it to their problem.</p>\n<h2>Get the build scoped</h2>\n<p>For custom work, your developer reviews the discovery before the quote is final. They check the tools, access, integrations, unknowns and what it will take to build and test it.</p>\n<p>Jarvis organises the facts and questions. You confirm the business requirements with the client; the developer confirms the technical approach and estimate.</p>\n<h2>Value and cost both matter</h2>\n<p>A valuable solution can support a substantial project price. It still needs to cover development, your work, fees, support and room for the project to be worthwhile.</p>\n<div class=\"b-ex\"><p>Made up numbers. A developer quotes $5,000. Charging $4,000 because it fits a percentage of the problem puts you behind before support or your own work. Either the scope, price or delivery approach needs to change.</p></div>\n<p>A percentage of the customer's problem can help them compare the investment. It is not a rule that overrides your costs or proves that every claimed saving will happen.</p>\n<div class=\"b-prompt\"><p>Prepare this deal for technical scoping, then help me price the approved scope using the customer value, actual delivery quote and costs.</p></div>\n<p>Have the scope and economics clear before you present the project price.</p>", "empty": false, "guide": null}, {"id": "m6-the-proposal-and-demo-generator", "mod": "Module 6", "modname": "Sales", "title": "Presenting the proposal and closing the deal", "lede": "Prepare a short proposal and a demonstration the owner can understand.", "body": "<p>Your proposal explains the change you agreed to discuss. The owner should recognise their business, see what you are building and understand the investment.</p>\n<h2>Keep the proposal clear</h2>\n<ol><li>The problem and impact they described.</li><li>The result and proposed system in plain words.</li><li>What is included, what is excluded and what they provide.</li><li>The agreed delivery stages, project price and running costs.</li><li>Payment, support and the next step.</li></ol>\n<p>Use the developer-reviewed scope for custom work. Resolve important unknowns before offering a final price.</p>\n<h2>Show them the shape</h2>\n<p>A relevant demo makes the proposal real. If you are selling a website, showing the page gives them something concrete to react to. For a custom system, show one representative workflow rather than building the whole project before the deal.</p>\n<p>Open the demo separately. Call it a prototype when it is a prototype, and explain what the production build will connect to.</p>\n<div class=\"b-prompt\"><p>Create the call-two proposal from this deal\u2019s discovery, developer-approved scope and agreed terms. Keep the demo separate.</p></div>\n<p>Read the proposal as the client. You should be able to explain each included item and why it solves something they raised.</p>", "empty": false, "guide": null}, {"id": "m6-call-two-present-and-close", "mod": "Module 6", "modname": "Sales", "title": "Call two: present and close", "lede": "Show the solution, explain the price and ask for the decision.", "body": "<p>Have the proposal, scope and demo ready. You are walking through a project the owner can understand and decide on.</p>\n<h2>Recap the problem</h2>\n<div class=\"b-script\"><p>Good to see you again, [name]. Before I show you the plan, let me check I have the picture right. You told me [problem], which is causing [impact]. The result you want is [outcome]. Is that still accurate?</p></div>\n<p>If something has changed, understand it before presenting a solution to the old situation.</p>\n<h2>Show the system</h2>\n<div class=\"b-script\"><p>Here is what we would put in place. At the moment, [current process]. With this system, [new process]. Let me show you one example going through it.</p><p>[Walk through the relevant demo.]</p><p>This part handles [specific work]. Your team still handles [their responsibility]. Does that fit how you would want it to work?</p></div>\n<h2>Explain the package and price</h2>\n<div class=\"b-script\"><p>The project includes [the agreed deliverables], setup with [their tools], testing and [the agreed handover/support]. The total project price is [price]. The running costs are [amount and basis], and the payment arrangement is [agreed terms].</p><p>What questions do you have about the plan?</p></div>\n<p>Explain a genuine package as a package. You do not need a ladder of percentages or invented separate prices to make the work valuable.</p>\n<h2>Ask for the next step</h2>\n<div class=\"b-script\"><p>Does this look like the right solution for the business?</p><p>[If yes:] Great. I will send the agreement with the scope and payment terms we discussed. Once those are sorted, we will confirm kickoff and collect the access we need.</p><p>[If unsure:] What is the main thing you need to feel clear about before moving forward?</p></div>\n<p>Give them room to answer. Work through the actual concern, then agree a decision or a specific follow-up.</p>\n<p>I prefer getting paid upfront for an agreed project. If you agree instalments, put the stages in the proposal and collect against those terms. The client should know exactly what starts the work and what is due later.</p>", "empty": false, "guide": null}, {"id": "m6-objections", "mod": "Module 6", "modname": "Sales", "title": "Prepare for the questions and objections", "lede": "Use the actual buyer and proposal to prepare useful answers.", "body": "<p>An objection tells you what the owner still needs to understand or decide. Find that out before trying to answer it.</p>\n<table class=\"tbl\"><tr><th>What they say</th><th>What to understand</th></tr><tr><td>It is too expensive.</td><td>Budget, cash timing, perceived value or a different expectation?</td></tr><tr><td>I need to think about it.</td><td>What part is unresolved, and what would help them decide?</td></tr><tr><td>I need to speak to my partner.</td><td>Who decides, what do they need and when can you speak together?</td></tr><tr><td>We already have software.</td><td>Does it solve this workflow, or does the gap remain?</td></tr><tr><td>We could build it ourselves.</td><td>Do they have the capacity and a plan, or want someone accountable for delivery?</td></tr><tr><td>What if it does not work?</td><td>Which technical or business risk concerns them? Show the relevant demo, tests and actual agreed remedy.</td></tr></table>\n<h2>Ask before answering</h2>\n<div class=\"b-script\"><p>When you say [their concern], what is the main part you are worried about?</p></div>\n<p>Use their answer. A cash-flow problem is different from not believing the system will fit.</p>\n<h2>Have Jarvis prepare for this buyer</h2>\n<div class=\"b-prompt\"><p>Prepare the likely questions and objections for this proposal from the actual discovery, scope and proof we have.</p></div>\n<p>Keep technical unknowns for your developer to answer. Only offer a guarantee or remedy you have agreed and can honour. A specific delivery commitment is different from promising any business a guaranteed income.</p>", "empty": false, "guide": null}, {"id": "m6-get-your-calls-reviewed", "mod": "Module 6", "modname": "Sales", "title": "Get your sales calls reviewed", "lede": "Turn a real conversation into a few useful improvements for the next one.", "body": "<p>A call gives you much more to work with than a memory of how it felt. Let Jarvis review what was actually said and where the conversation moved or got stuck.</p>\n<h2>Use the call record</h2>\n<p>Keep the permitted recording or transcript with the right prospect. Include whether it was discovery or a proposal conversation, and what happened afterwards.</p>\n<div class=\"b-prompt\"><p>Review this sales call against my offer and the deal context. Show the important evidence and the three changes that would improve my next call.</p></div>\n<h2>Look for useful coaching</h2>\n<p>The review should explain what you understood well, what remained unclear and whether the solution and next step fit the conversation. A useful point refers to something actually said.</p>\n<p>For example, \u201cYou heard that quotes get lost, but never asked how often it happens\u201d gives you a question to improve. A score without an explanation gives you very little.</p>\n<h2>Practise one change</h2>\n<p>Choose the most important improvement and rehearse it with Jarvis. Bring difficult questions to the coaching support included with your membership.</p>\n<p>A transcript can show the words and questions. It cannot reliably tell you how your tone or pace sounded. Use the recording when that is the issue.</p>", "empty": false, "guide": null}, {"id": "m7-two-ways-to-deliver", "mod": "Module 7", "modname": "Fulfilment", "title": "Two Ways To Deliver", "lede": "You have money in the bank and a promise to keep. The first decision is who builds it.", "body": "<!-- module-context:start -->\n<p>In this module, you\u2019ll learn how to deliver the work you\u2019ve sold, hand it over properly and look after the client afterwards. You can build it yourself with Jarvis or hire a developer and manage the delivery.</p>\n<p>You\u2019re doing this so a sale becomes a working service and a client who wants to stay. We\u2019ll cover finding and checking developers, agreeing the build, testing, training the client and ongoing support.</p>\n<p><strong>By the end, you\u2019ll have a delivery plan, a way to check the finished work and a clear process for handover, support and retaining the client.</strong></p>\n<!-- module-context:end -->\n<p>The project has been agreed. You owe a business owner a working system, and how you deliver it decides whether this deal makes you money or eats the next three weeks of your life. There are two ways to deliver. Pick one before you touch a single build.</p>\n<h2>The two paths</h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDUyMCIgZm9udC1mYW1pbHk9IidJbnN0cnVtZW50IFNhbnMnLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNTIwIiBmaWxsPSIjZmZmZmZmIi8+CiAgPGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjEwIiBtYXJrZXJIZWlnaHQ9IjEwIiByZWZYPSI4IiByZWZZPSI1IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDEwIDUgTDAgMTAgeiIgZmlsbD0iIzhiOGU5YyIvPjwvbWFya2VyPjwvZGVmcz4KICA8dGV4dCB4PSI2MCIgeT0iNTQiIGZvbnQtZmFtaWx5PSInRnJhdW5jZXMnLCBHZW9yZ2lhLCBzZXJpZiIgZm9udC1zaXplPSIyNiIgZm9udC13ZWlnaHQ9IjYwMCIgZmlsbD0iIzBlMTAxNiI+VHdvIHdheXMgdG8gZGVsaXZlciwgb25lIHBsYW4sIG9uZSBoYW5kb3ZlcjwvdGV4dD4KICA8IS0tIHN0YXJ0IC0tPgogIDxyZWN0IHg9IjYwIiB5PSIyMTAiIHd Their job is the build.</p>\n<p><strong>Self fulfilment.</strong> You sold it and you build it, with Jarvis doing most of the work. Same build plan, handed to Jarvis one piece at a time, tested, delivered by you. Higher margin, more of your hours, and it only works if you are comfortable in the tools.</p>\n<h2>My honest recommendation</h2>\n<p>If you are not technical, bring someone technical in to finish the job. Every time. Do the creative side yourself: the workflow design, the client conversations, the demo. Then hand the build to someone who already knows how to wire it, instead of learning it from scratch while a paying client waits.</p>\n<p>That is not a comment on your ability. You just proved you can find a business owner, diagnose a real problem and get paid five figures to fix it. That skill is rare and it is the one that scales. Debugging an integration at eleven at night is not rare, and plenty of good people will do it for a fixed fee. The people who stall here are never the ones who could not sell. They sold, then disappeared into a build they were not ready for.</p>\n<div class=\"b-note\"><p>I keep a list of developers we have already vetted, and the weekly strategy session is there for exactly this. Signed a deal and not sure who should build it? Bring it to the session before you start anything.</p></div>\n<h2>How to decide</h2>\n<p>Three questions about the deal in front of you. Answer them honestly, not optimistically.</p>\n<table class=\"tbl\"><tr><th>Question</th><th>Hand it to a developer</th><th>Build it yourself</th></tr>\n<tr><td>Have I built something like this before, end to end, and had someone else use it?</td><td>No, or only a demo</td><td>Yes, in a live business</td></tr>\n<tr><td>Does it plug into tools I have never connected? Their CRM, accounting, booking, phones.</td><td>Yes, more than one</td><td>No, or one I know</td></tr>\n<tr><td>What happens to my pipeline if this build takes three times longer than I think?</td><td>Outreach stops</td><td>Outreach keeps running without me</td></tr>\n</table>\n<p>Two or more in the middle column: hand it off. Two or more on the right: build it with Jarvis. Split: hand it off this time and sit beside the developer, so the next one is yours.</p>\n<h2>What stays the same on both paths</h2>\n<ol>\n<li><strong>The build plan comes first.</strong> Nobody builds anything until the scoping skill has turned your call notes and proposal into a full plan. That plan is the contract between what was sold and what gets built.</li>\n<li><strong>It is built on test data.</strong> The client's live records are never where you find out there is a bug.</li>\n<li><strong>It is tested the way the client will use it</strong> before they ever see it.</li>\n<li><strong>Handover is a process</strong>, with training, acceptance, any payment due under the agreement and the agreed support.</li>\n</ol>\n<h2>What the margin looks like</h2>\n<div class=\"b-ex\"><p>Made up numbers, to show the shape. You sell an intake and quoting system for $12,000 with $400 a month running costs. Hand it off: a developer quotes $3,500 fixed in three milestones, you spend ten hours on scoping, reviews and handover, leaving $8,500 before your own work, fees, support and other costs. Build it yourself: no developer cost, forty hours with Jarvis, leaving $12,000 before your own work, fees, support and other costs. Both are good deals. The only question is which one you can finish while your outreach keeps running.</p></div>\n<h2>Let Jarvis make the call with you</h2>\n<div class=\"b-prompt\"><p>Help me choose the delivery route for this saved deal using its requirements, my experience and the technical support available.</p></div>\n<p>Write the answer in one line at the top of the deal in your CRM.</p>", "empty": false, "guide": null}, {"id": "m7-arbitrage-find-and-vet-developers", "mod": "Module 7", "modname": "Fulfilment", "title": "Find and vet developers", "lede": "Have someone capable of scoping and delivering the system before you need them.", "body": "<p>Build the relationship before you need to promise a custom project. You want a developer who has delivered relevant systems, asks useful questions and can explain what the build needs.</p>\n<h2>Start with relevant experience</h2>\n<p>Use the developer access included with your membership, or find your own through referrals, tool communities or <a href=\"https://www.upwork.com/\" target=\"_blank\" rel=\"noopener\">Upwork</a>. Ask to see a similar working system and how they handled the difficult parts.</p>\n<h2>Prepare the job</h2>\n<div class=\"b-prompt\"><p>Draft a developer job post from this deal\u2019s saved requirements. Include the workflow, connected tools, required experience and questions we need answered.</p></div>\n<p>Describe the business without naming the client. Explain the result, integrations, sample data you can provide and whether you need a pre-sale estimate or an accepted project built.</p>\n<h2>Post and shortlist</h2>\n<ol><li>Open the hiring area in your client account and start a job post.</li><li>Add the prepared description and choose a suitable project arrangement.</li><li>Ask applicants for a relevant build and how they would approach this workflow.</li><li>Compare a small shortlist against the same requirements.</li><li>Agree scope, milestones, communication and payment before hiring.</li></ol>\n<p>Use fixed-price milestones when the scope is clear enough for them. If you agree a paid test, keep it small and check a real piece of the work.</p>\n<h2>What I would check</h2>\n<ul><li><strong>Relevant work:</strong> a demonstration of something similar that actually runs.</li><li><strong>Questions:</strong> they identify missing access, business rules and risks.</li><li><strong>Communication:</strong> you can understand their updates and know what is blocked.</li><li><strong>Delivery:</strong> they can explain testing, handover and support.</li></ul>\n<p>A cheap quote is useful when the work gets delivered properly. Get the technical estimate before you decide what the client project will cost you.</p>", "empty": false, "guide": null}, {"id": "m7-arbitrage-scope-hand-off-keep-the-margin", "mod": "Module 7", "modname": "Fulfilment", "title": "Scope the project with your developer", "lede": "Jarvis prepares the information. Your developer scopes the technical work.", "body": "<p>AI arbitrage means you sell and manage a valuable solution while a qualified developer handles the technical delivery. Get that developer involved before the custom quote is final.</p>\n<h2>Turn discovery into a clear brief</h2>\n<p>Jarvis brings together the conversation, current workflow, desired result, connected tools and questions still open. Your developer reviews what is possible, what access is needed and what it will take to build and test.</p>\n<div class=\"b-prompt\"><p>Prepare this deal for my developer to scope using the saved discovery and proposed solution. Separate known requirements from unanswered questions.</p></div>\n<p>You confirm how the business needs to work. The developer confirms the technical approach, scope, estimate and exclusions.</p>\n<h2>Resolve what changes the quote</h2>\n<div class=\"b-ex\"><p>The client wants enquiries added to their CRM. Before quoting, the developer needs to know which CRM and where enquiries arrive. Email-only intake and email-plus-phone intake can be different builds. Ask the client, agree what is included and price that scope.</p></div>\n<p>A skill can organise the questions. It cannot know an account restriction or business rule nobody has supplied.</p>\n<h2>Agree the delivery</h2>\n<p>Once the client accepts, turn the agreed scope into the build plan. Record who owns each stage, what the client provides, how progress is shown, what will be tested and how changes are approved.</p>\n<p>You can agree for the developer to lead technical client conversations. Keep the client relationship, decisions and commercial agreement clear.</p>\n<h2>Protect the economics</h2>\n<p>Use the actual developer quote. Include your own work, software, payment fees, support and room for changes when pricing the project. The amount left after the developer is paid is not automatically your take-home profit.</p>\n<p>Review the work at the agreed milestones. When the client requests something outside the accepted scope, explain the additional work and agree the change before building it.</p>", "empty": false, "guide": null}, {"id": "m7-self-fulfilment-build-it-with-jarvis", "mod": "Module 7", "modname": "Fulfilment", "title": "Research, plan and build with Jarvis", "lede": "Understand the workflow and agree the plan before starting the build.", "body": "<p>For a system you are delivering with Jarvis, the plan comes first. Give it the business problem, agreed scope and access to the relevant information before asking it to create anything.</p>\n<h2>Research the actual business</h2>\n<p>Have Jarvis inspect the current workflow, tools, sample inputs and the result the client needs. It should identify missing information and investigate the integrations the build depends on.</p>\n<p>For design work, show references. Explain what you like about them and what should fit this client. A useful example gives much clearer direction than \u201cmake it look premium\u201d.</p>\n<h2>Get the plan clear</h2>\n<div class=\"b-prompt\"><p>Research this project, inspect the relevant workflow and references, and create a detailed build plan before making changes.</p></div>\n<p>The plan should explain the stages, connected tools, client actions, important exceptions and how the finished work will be checked. Confirm the business requirements with the client and bring technical questions to your support team or developer.</p>\n<h2>Build in useful pieces</h2>\n<p>Start with one workflow on test data. Open it, try it and give specific feedback. Continue when that part behaves as agreed. Keep the plan and build record together so Jarvis knows what has changed.</p>\n<div class=\"b-prompt\"><p>Build the first approved part of this project on test data, show me the result and save what changed against the plan.</p></div>\n<p>Use your first-build support when you get stuck. If the project needs technical experience outside your supported route, bring in a developer before making promises to the client.</p>", "empty": false, "guide": null}, {"id": "m7-self-fulfilment-test-it-like-the-client-will", "mod": "Module 7", "modname": "Fulfilment", "title": "Self Fulfilment: Test It Like the Client Will", "lede": "Clients do not use systems the way you built them. Find that out yourself, in private.", "body": "<p>Every module passed its own test. That is not the same as the system working. The client is going to put a real job through it, start to finish, on a busy Tuesday, from their phone, with a typo in the email address. Before they see it, you run it the way they will, end to end, and fix what breaks in private.</p>\n<h2>Why I never skip this</h2>\n<p>The first time a client sees their system is the moment they decide whether you are a professional. If the first job they push through gets stuck, the build could be ninety five percent perfect and they will remember the five. If it runs clean, they forgive small things for months. Testing is about controlling the first impression of something you have been paid five figures for.</p>\n<p>It is also where the retainer gets sold without saying a word. A client who watches a system handle a messy edge case properly understands why it is worth paying to keep it running.</p>\n<h2>Three jobs, end to end</h2>\n<ol>\n<li><strong>The clean job.</strong> Everything present, everything normal. It goes all the way through with no human stepping in except where the plan says they do.</li>\n<li><strong>The messy job.</strong> A missing field, a wrong format, a duplicate of a job already in the system. Each lands where the plan says, flagged for a person, not silently dropped and not silently guessed.</li>\n<li><strong>The job from the client's seat.</strong> On a phone, logged in as the role that will actually use it, not as you with full access. Half of what you find will be about what that person can and cannot see.</li>\n</ol>\n<p>Go back and forth with Jarvis the same way you built it. Input, what happened, what should have happened. One fix per message. Rerun the job from the start after every fix, because a fix in step four can break step two.</p>\n<h2>Jarvis writes the checklist from the plan</h2>\n<div class=\"b-prompt\"><p>Create the client-use test checklist from this project\u2019s saved build plan and build record. Include a normal job, exceptions and the client\u2019s actual user role.</p></div>\n<h2>Keep the log</h2>\n<p>Write down what you ran, what failed, what you fixed, and that it passed on the rerun. Date it. It proves to you the system is ready, it becomes the first page of the handover so the client sees the edge cases were thought about, and it is the raw material for your case study.</p>\n<div class=\"b-note\"><p>If a developer built it, this still applies to you. Do not accept the final milestone on their word. Run the three jobs yourself, on the recording or the test system, and release payment when they pass.</p></div>\n<h2>Then show the client, a little</h2>\n<p>Once the three jobs pass clean, send the client a short screen recording of the clean job going through, with one line: \"Here is a job going through your system start to finish. Handover is booked for [date] and I will walk you through it then.\" No login yet. No poking at it unsupervised. They get their hands on it at handover, with you beside them.</p>\n<p>Three passes from the start, dated, in the log. Then book the handover.</p>", "empty": false, "guide": null}, {"id": "m7-client-communication-with-jarvis", "mod": "Module 7", "modname": "Fulfilment", "title": "Your client, Jarvis and one project chat", "lede": "Keep requests, context and updates together in the client\u2019s group.", "body": "<p>One of the best ways I have found to keep delivery moving is a group chat with the client and Jarvis. The client can ask about their system in the same place the work is being discussed.</p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDI3MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJPbmUgcmVxdWVzdCBzdGF5cyBjb25uZWN0ZWQgdG8gdGhlIHJpZ2h0IHByb2plY3QiPjxyZWN0IHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjI3MCIgZmlsbD0iI2ZiZmJmYyIvPjx0ZXh0IHg9IjM2IiB5PSI0MiIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMwZTEwMTYiPk9uZSByZXF1ZXN0IHN0YXlzIGNvbm5lY3RlZCB0byB0aGUgcmlnaHQgcHJvamVjdDwvdGV4dD48cmVjdCB4PSIzNi4wIiB5PSI3OCIgd2lkdGg9IjI2MS4wIiBoZWlnaHQ9IjE0NSIgcng9IjEwIiBmaWxsPSIjZWZlY2ZiIiBzdHJva2U9IiNkOGNmZWUiLz48dGV4dCB4PSIxNjYuNSIgeT0iMTI1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMiIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiM0YjJmYzQiPkNsaWVudCBhc2tzPC90ZXh0Pjx0ZXh0IHg9IjE2Ni41IiB5PSIxNTkiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNWE1ZDZiIj5PbmUgcHJvamVjdCBjaGF0PC90ZXh0Pjx0ZXh0IHg9IjMxMS4wIiB5PSIxNTMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM1YTVkNmIiPuKGkjwvdGV4dD48cmVjdCB4PSIzMjUuMCIgeT0iNzgiIHdpZHRoPSIyNjEuMCIgaGVpZ2h0PSIxNDUiIHJ4PSIxMCIgZmlsbD0iI2VmZWNmYiIgc3Ryb2tlPSIjZDhjZmVlIi8+PHRleHQgeD0iNDU1LjUiIHk9IjEyNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjIiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSIjNGIyZmM0Ij5KYXJ2aXMgcHJlcGFyZXM8L3RleHQ+PHRleHQgeD0iNDU1LjUiIHk9IjE1OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPkNvbnRleHQgYW5kIG5leHQgc3RlcDwvdGV4dD48dGV4dCB4PSI2MDAuMCIgeT0iMTUzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjNWE1ZDZiIj7ihpI8L3RleHQ+PHJlY3QgeD0iNjE0LjAiIHk9Ijc4IiB3aWR0aD0iMjYxLjAiIGhl  next and explain when access or a decision is blocking progress. The client should be able to see that the work is moving.</p>\n<div class=\"b-prompt\"><p>Help me set up the client communication group for this project and explain the request, approval and update process.</p></div>\n<p>Try one test request and check it reaches the right project before inviting the client to use it.</p>", "empty": false, "guide": null}, {"id": "m7-onboard-hand-over-get-paid", "mod": "Module 7", "modname": "Fulfilment", "title": "Onboard, hand over and collect against your terms", "lede": "Start with clear payment and access, then hand over a system the client can use.", "body": "<p>I prefer getting paid upfront for an agreed project. If you agree instalments, put the amounts and milestones in the agreement. Collect each payment when those terms say it is due.</p>\n<h2>Start the project properly</h2>\n<p>Confirm the accepted scope, payment arrangement, delivery owner and kickoff. Collect the access and sample information the build needs through the proper account connections.</p>\n<p>Explain where the client requests changes and how progress will be shared. Book the important reviews so they know when they will see the work.</p>\n<h2>Show the system working</h2>\n<p>At handover, run a real workflow together. Show the normal job, a useful exception and what their team needs to do. Have the person using it try it while you are there.</p>\n<p>Record the agreed checks and any remaining items. Give the client access, a short guide and a clear way to get support.</p>\n<h2>Close the agreed milestone</h2>\n<p>Ask for written acceptance of what has been delivered. If a remaining instalment is due at this stage, collect it against the agreed terms. An upfront-paid project does not need a new final build invoice just because handover happened.</p>\n<p>Your developer has their own payment agreement. Release their milestones against the work and acceptance you agreed with them.</p>\n<h2>Make support clear</h2>\n<p>Explain what is included, how requests are handled and what counts as new work. If ongoing monitoring or changes need a retainer, put that arrangement in writing.</p>\n<div class=\"b-prompt\"><p>Prepare the handover from this project\u2019s accepted scope, test record, payment terms and support agreement.</p></div>\n<p>The client should know how to use the system, who to contact and what happens after the handover.</p>", "empty": false, "guide": null}, {"id": "m7-support-retainer-and-raising-the-price", "mod": "Module 7", "modname": "Fulfilment", "title": "Support, Retainer and Raising the Price", "lede": "The install was the start. Everything after it is margin, proof and a higher price next time.", "body": "<p>You have been paid for the build. Three things in the next thirty days decide whether that was one deal or the start of a business: support it properly, turn it into a monthly retainer, and turn the result into the reason the next client pays more. None of them is hard. All of them get skipped by people already chasing the next sale.</p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDQwMCIgZm9udC1mYW1pbHk9IidJbnN0cnVtZW50IFNhbnMnLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iNjAiIHk9IjU0IiBmb250LWZhbWlseT0iJ0ZyYXVuY2VzJywgR2VvcmdpYSwgc2VyaWYiIGZvbnQtc2l6ZT0iMjYiIGZvbnQtd2VpZ2h0PSI2MDAiIGZpbGw9IiMwZTEwMTYiPlRoZSB0aGlydHkgZGF5cyBhZnRlciBzaWduIG9mZjwvdGV4dD4KICA8bGluZSB4MT0iMTAwIiB5MT0iMjAwIiB4Mj0iMTEwMCIgeTI9IjIwMCIgc3Ryb2tlPSIjZTZlN2VjIiBzdHJva2Utd2lkdGg9IjQiLz4KICA8Y2lyY2xlIGN4PSIxMDAiIGN5PSIyMDAiIHI9IjEyIiBmaWxsPSIjNGIyZmM0Ii8+CiAgPGNpcmNsZSBjeD0iNzYwIiBjeT0iMjAwIiByPSIxMiIgZmlsbD0iIzRiMmZjNCIvPgogIDxjaXJjbGUgY3g9IjExMDAiIGN5PSIyMDAiIHI9IjEyIiBmaWxsPSIjOGE2MjEwIi8+CiAgPHJlY3QgeD0iMTAwIiB5PSIxODgiIHdpZHRoPSI2NjAiIGhlaWdodD0iMjQiIHJ4PSIxMiIgZmlsbD0iI2VmZWNmYiIvPgogIDx0ZXh0IHg9IjEwMCIgeT0i nward retainer, case study and a higher price\"><figcaption>Thirty days, one call, then the most profitable money in the deal.</figcaption></figure>\n<h2>The thirty day support window</h2>\n<p>Thirty days from sign off, and defined. Included: anything that does not behave the way it was shown at handover, questions from the people using it, small wording changes. Not included: new modules, new integrations, anything on the follow on list. Those are change requests with a price, said warmly the moment one comes up. Reply inside a working day, fix inside two for anything that stops a job moving, and keep every request in the deal record.</p>\n<h2>What the retainer is</h2>\n<p>Systems do not run themselves. Tools update, a login expires, a new hire needs training. The retainer is the monthly fee that keeps the system working and keeps you as the person they call. It is usually the most profitable money in the deal, because the work is light and it adds up across clients.</p>\n<table class=\"tbl\"><tr><th>The retainer covers</th><th>In practice</th></tr>\n<tr><td>Running costs</td><td>Platform, automation seats, AI usage, passed through with a margin. If it costs $300 a month to run, bill $400 to $450.</td></tr>\n<tr><td>Monitoring</td><td>A weekly check that jobs are moving and nothing has silently stopped. Jarvis runs most of it.</td></tr>\n<tr><td>Small changes</td><td>A fixed allowance each month. Anything bigger is quoted.</td></tr>\n<tr><td>Support and training</td><td>Same response times as the support window, plus onboarding new staff.</td></tr>\n<tr><td>A monthly report</td><td>One page: jobs through the system, time saved, what was flagged, what changed. Your case study, written for you every month.</td></tr>\n</table>\n<p>One flat monthly figure that covers the running costs with margin plus your time, simple enough to say in one sentence. Bring it to the group session and we pressure test it.</p>\n<h2>How to offer it on the day thirty call</h2>\n<p>You booked this call at handover, so it is expected. Ten minutes. Open with the month's numbers, then offer the retainer as the way to keep what they have.</p>\n<div class=\"b-script\"><p>Thirty days in. [Number] jobs have gone through the system, [number] were flagged for your team and cleared, and you have not had to chase a quote by hand since we went live. Two things I want to put to you. First, the system needs someone keeping it running. The tools it sits on change, your team changes, and it costs [amount] a month in platforms to run. Second, you have already asked for [the follow on items], which I noted and did not build for free. The retainer is [amount] a month. It covers the running costs, me watching it weekly, small changes as you need them, support for your team, and a one page report every month. The follow on work gets quoted separately when you want it. Want me to send that over so it starts from the first?</p></div>\n<p>If they say not now, the running costs still have to be paid by someone. Transfer the accounts to them cleanly, leave the door open, set a reminder in Jarvis for sixty days. A good number come back the first time something breaks.</p>\n<h2>Write the case study now</h2>\n<p>The test log, the build log and the first monthly report are a case study that has not been written yet. Write it in the first month while the numbers are fresh and the client is pleased, and get their written permission before anything goes on a page, an ad or a call.</p>\n<div class=\"b-prompt\"><p>Write a one page case study from the [client] deal record: the problem in the client's words from the call one brief, what it was costing them, what we built in plain language, the before and after of how a job moves, and the results from the first monthly report with the actual numbers from the system. Separate time saved from money saved and keep revenue claims out unless the client gave us a figure. Mark any number that is an estimate. Write it so a similar business owner would recognise themselves in the first paragraph. Then write a two sentence version I can say on a call. Do not publish anything; I will get the client's written permission first.</p></div>\n<h2>Raise the price</h2>\n<p>Your last result gives you better evidence for your next offer. Before this deal you were selling a promise. After it you are selling a thing that exists, with a number next to it. The build is still priced against what the problem costs, but your range moves up, and the proposal now opens with proof.</p>\n<ul>\n<li>Put the two sentence case study into call one, right after you have found the pain: \"we did this for a [similar business] last month.\"</li>\n<li>Add the retainer to every proposal from now on as a standard line.</li>\n<li>Decide the next price today, write it in your offer document, and tell the group session so someone holds you to it.</li>\n</ul>\n<div class=\"b-ex\"><p>Made up numbers. First quoting system, $9,000, no retainer. Day thirty you offer $600 a month and they take it. Your next proposal opens with quotes going out the same day instead of in three, prices the build at $14,000, and includes the retainer from the start. Same work. One proof point.</p></div>\n<p>Offer the retainer, draft the case study, write the new price down and tell someone.</p>", "empty": false, "guide": null}];
