<style>
:root{--bg:#060A12;--panel:#0B1626;--panel2:#0E1C30;--line:#16263A;--line2:#1E4458;--ink:#E6EEF5;--soft:#C9D6E2;--muted:#94A7BA;--cyan:#5FD4EA;--amber:#F5B74A;--green:#5FE0B4;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Space Grotesk',system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#0E2238 0%,transparent 65%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
.top{position:sticky;top:0;z-index:10;background:rgba(6,10,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:600 15px var(--mono);letter-spacing:.36em;display:flex;align-items:center;gap:10px}.brand i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.ttl{font:500 12px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.prog{flex:1;min-width:200px;display:flex;align-items:center;gap:12px;font:500 12px var(--mono);color:var(--muted)}.track{flex:1;height:6px;border-radius:3px;background:#132339;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2EA8C4,var(--cyan));transition:width .3s}
.menu{display:none;font:600 13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px}
nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding:24px 4px 30px 0}
.mh{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between}
.mh:first-child{margin-top:0}
.li{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--soft);font:400 14.5px/1.35 var(--sans);padding:7px 10px;border-radius:8px;cursor:pointer}
.li:hover{background:var(--panel)}.li.on{background:var(--panel);border-color:var(--line2);color:var(--ink)}
.li .dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);margin-top:5px}.li.read .dot{background:var(--green);border-color:var(--green)}.li.soon{color:#71849a}.li.soon .dot{border-style:dashed}
main{min-width:0;padding-top:26px}
.crumb{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
h1{font-size:38px;line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
.lede{font-size:20px;line-height:1.5;color:var(--soft);border-left:3px solid var(--cyan);padding-left:16px;margin:0 0 26px}
.lesson h2{font-size:24px;margin:36px 0 10px;line-height:1.25}.lesson h3{font-size:19px;margin:26px 0 8px}.lesson p{margin:0 0 14px;color:var(--soft)}.lesson strong{color:var(--ink)}
.lesson ul,.lesson ol{color:var(--soft);padding-left:22px}.lesson li{margin:6px 0}
.lesson a{color:var(--cyan)}
.learning-section{border-top:1px solid var(--line);padding-top:6px;margin-top:22px}.learning-section:first-child{border-top:0;margin-top:0}
.section-purpose{font:500 13px var(--mono);letter-spacing:.04em;color:var(--muted);margin:14px 0 -4px}.section-purpose::before{content:"Why: ";color:var(--cyan)}
.b-prompt{position:relative;background:#050A13;border:1px solid rgba(95,212,234,.35);border-radius:10px;margin:16px 0;padding:32px 16px 12px}
.b-prompt::before{content:"Send to Jarvis";position:absolute;top:10px;left:16px;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.b-prompt p{font:400 15px/1.6 var(--mono);color:#DFF6FB;margin:0 0 8px}.b-prompt p:last-child{margin:0}
.copy{position:absolute;top:7px;right:8px;font:600 12px var(--sans);color:#04131B;background:var(--cyan);border:0;border-radius:7px;padding:5px 12px;cursor:pointer}
.b-ex{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:30px 16px 10px;margin:16px 0;position:relative}
.b-ex::before{content:"Example";position:absolute;top:10px;left:16px;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.b-script{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:30px 16px 10px;margin:16px 0;position:relative}
.b-script::before{content:"Script";position:absolute;top:10px;left:16px;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.b-note{background:rgba(245,183,74,.06);border:1px solid rgba(245,183,74,.3);border-radius:10px;padding:12px 16px;margin:16px 0}
.fig{margin:20px 0;background:#F4F6F9;border-radius:12px;padding:14px;text-align:center}.fig img{max-width:100%;height:auto}.fig figcaption{color:#3b4656;font-size:14px;margin-top:6px}
.tbl,.lesson table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px;display:block;overflow-x:auto}
.lesson th,.lesson td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;color:var(--soft)}.lesson th{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.soonbox{background:var(--panel);border:1px dashed var(--line2);border-radius:14px;padding:20px;color:var(--soft)}
.soonbox b{display:block;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pbtn{font:600 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 16px;cursor:pointer;max-width:48%;text-align:left}
.pbtn small{display:block;font:500 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.mark{font:600 14px var(--sans);color:#04131B;background:var(--cyan);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}.mark.done{background:var(--green)}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.intro p{margin:0;color:var(--soft)}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:0}nav{display:none;position:static;max-height:none;border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px}nav.open{display:block}.menu{display:inline-block}h1{font-size:30px}.pbtn{max-width:100%;width:100%}}
</style></head><body>

<script>
const MODS=[{"num": "Module 1", "name": "Jarvis 2.0", "blurb": "Use your Jarvis workspace, CRM and skills together, with your business context saved as you progress.", "lessons": ["m1-your-unfair-advantage-set-up-first", "m1-install-jarvis-2-0", "m5-your-crm", "m1-load-the-high-ticket-skill-pack", "m1-connect-your-pipeline", "m1-prove-it-on-something-real"]}, {"num": "Module 2", "name": "The Irresistible Offer", "blurb": "Understand the offer, explore services and niches, then create yours with Jarvis.", "lessons": ["m2-the-irresistible-offer", "m2-three-ways-to-find-an-offer-that-scales", "m2-choose-your-niche", "m2-write-the-offer", "m2-create-your-offer"]}, {"num": "Module 3", "name": "Funnels", "blurb": "Build a clear route from your offer to an application, a booked conversation and a prepared prospect.", "lessons": ["m5-what-the-funnel-is-actually-for", "m5-build-the-page", "m5-get-them-to-show-up-ready", "m5-the-follow-up-that-runs-without-you"]}, {"num": "Module 4", "name": "Client Acquisition: Outreach", "blurb": "Build the list, enrich it, then hit it from the phone, LinkedIn, DMs, email and SMS with one message and one pipeline behind it. Channels on their own are a hobby. Packaged together they are a machine.", "lessons": ["m3-the-whole-system-on-one-page", "m3-build-the-account-list", "m3-enrich-it", "m3-cold-calling", "m3-linkedin", "m3-dm-outreach", "m3-email-and-sms", "m3-package-it-all-together"]}, {"num": "Module 5", "name": "Client Acquisition: Paid Ads", "blurb": "Create ads around a clear offer, understand your acquisition economics and use the results to plan the next test.", "lessons": ["m4-how-ads-actually-work", "m4-the-ad-skills", "m4-launch-and-manage-campaigns"]}, {"num": "Module 6", "name": "Sales", "blurb": "Understand the business, scope the solution and present a proposal the owner can decide on.", "lessons": ["m6-one-conversation-two-calls", "m6-call-one-find-the-pain", "m6-prescribe-the-solution", "m6-the-proposal-and-demo-generator", "m6-call-two-present-and-close", "m6-objections", "m6-get-your-calls-reviewed"]}, {"num": "Module 7", "name": "Fulfilment", "blurb": "Two ways to deliver what you just sold. Arbitrage means somebody technical builds it and you own the client. Self fulfilment means you and Jarvis build it. Most people end up doing both, one per deal.", "lessons": ["m7-two-ways-to-deliver", "m7-arbitrage-find-and-vet-developers", "m7-arbitrage-scope-hand-off-keep-the-margin", "m7-self-fulfilment-build-it-with-jarvis", "m7-self-fulfilment-test-it-like-the-client-will", "m7-client-communication-with-jarvis", "m7-onboard-hand-over-get-paid", "m7-support-retainer-and-raising-the-price"]}];
const L=[{"id": "m1-your-unfair-advantage-set-up-first", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "Your Unfair Advantage, Set Up First", "lede": "Everything in this course runs through Jarvis. Before you pick a market or write an offer, the thing that does the work needs to exist.", "body": "<!-- module-context:start -->\n<p>You will use your Jarvis workspace, give it your business details and get familiar with the skills and CRM that run alongside it.</p>\n<p>Start here so Jarvis can work from your goals and saved information. Your leads, follow-ups and client work belong in that same business workspace.</p>\n<p><strong>By the end, you will know where your work lives and have a first task saved against your business.</strong></p>\n<!-- module-context:end -->", "empty": false, "guide": null}, {"id": "m1-install-jarvis-2-0", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "Install Jarvis 2.0", "lede": "One sitting. At the end of it, Jarvis knows who you are, what you sell and what you are chasing.", "body": "", "empty": true, "guide": ["Set up Jarvis", "steps 2 to 5"]}, {"id": "m5-your-crm", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "How to use your Jarvis and CRM dashboard", "lede": "Your leads, conversations and client work live in one workspace.", "body": "<p>Your CRM sits inside your Jarvis dashboard. This is where you see who you are speaking to, what has happened and what needs your attention.</p>\n<p>I want you spending your time on the business. Start by getting familiar with the workspace you have been given.</p>\n<h2>Open one lead</h2>\n<p>Open a lead and look at its business details, conversation, appointment, notes and next action. When somebody calls you back, this is where you pick up the conversation.</p>\n<h2>Follow the pipeline</h2>\n<p>The pipeline shows where each opportunity sits. A new enquiry becomes a conversation, a booked call, a proposal and eventually a client. Keep the stage accurate so Jarvis knows what should happen next.</p>\n<table class=\"tbl\"><tr><th>Stage</th><th>What it means</th></tr><tr><td>New lead or contacted</td><td>You have found the business or started the conversation.</td></tr><tr><td>Call booked or completed</td><td>There is an actual appointment, or the conversation has happened.</td></tr><tr><td>Proposal or second call</td><td>You are presenting a scoped solution and agreeing the project.</td></tr><tr><td>Won, lost or not now</td><td>Payment received, a clear no, or a suitable business to revisit later.</td></tr></table>\n<p>A verbal yes and a paid project are different things. Record what has actually happened.</p>\n<h2>Start your day here</h2>\n<p>Look at the calls coming up, follow-ups due and client work that needs a decision. Ask Jarvis about the record you are looking at. You should be able to follow the work from the first enquiry through to delivery.</p>", "empty": false, "guide": null}, {"id": "m1-load-the-high-ticket-skill-pack", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "Use your Jarvis skill library", "lede": "Tell Jarvis what you want to create. It uses your saved business context.", "body": "<p>A skill is the process Jarvis follows for a particular job. Your skill library covers researching an offer, building the funnel, creating acquisition assets, preparing proposals and planning delivery.</p>\n<p>Keep your business, chosen offer and work in the same workspace. When you ask for an ad, Jarvis should use the offer you already approved.</p>\n<h2>Ask naturally</h2>\n<div class=\"b-prompt\"><p>Show me the skills available in my workspace and use my saved business context to help me with my next step.</p></div>\n<p>If you have already chosen a niche or written an offer, tell Jarvis where that work is saved. It should ask for genuinely missing details.</p>\n<h2>Keep the context as you move</h2>\n<p>Once you approve something, ask Jarvis to save that version. Your landing page, outreach and ads should all use the same offer. When your offer changes, explain what changed so the work stays connected.</p>\n<p>You can also ask Jarvis to explain a section you are reading or help you complete it using your business.</p>", "empty": false, "guide": null}, {"id": "m1-connect-your-pipeline", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "Connect Your Pipeline", "lede": "Jarvis is only useful if it can see your deals, your calendar and your inbox, and write back into them.", "body": "", "empty": true, "guide": ["Your HUD", "steps 6 to 12"]}, {"id": "m1-prove-it-on-something-real", "mod": "Module 1", "modname": "Jarvis 2.0", "title": "Prove It on Something Real", "lede": "A setup you have not used is not a setup. Give it one real job and watch it finish.", "body": "", "empty": true, "guide": null}, {"id": "m2-the-irresistible-offer", "mod": "Module 2", "modname": "The Irresistible Offer", "title": "The Irresistible Offer", "lede": "Understand what makes an offer valuable before you create your own.", "body": "<section class=\"learning-section\" data-learning-section=\"offer\" data-section-title=\"What is an offer?\"><h2>What you will do in this module</h2><p>Read each lesson, then do the exercise with Jarvis. If something does not make sense, ask it to explain the section using your business. The course teaches the process; Jarvis helps you apply it.</p><p>You will choose a service and a type of business to sell it to, understand the problem you solve, then create your offer with Jarvis.</p><p>First, learn what makes an offer worth buying. Then explore the services and niche ideas. Finally, follow the steps to create yours.</p><p><strong>By the end, you will know who you help, what you do for them and why they would pay. You will have an offer ready to use in your marketing.</strong></p><h2>What is an offer?</h2><p>Your service is the work you do. Your offer tells the customer what they get, when they get it and why they should choose you.</p><div class=\"b-ex\"><p><strong>The service:</strong> Install an AI receptionist.</p><p><strong>The offer:</strong> We\u2019ll get your plumbing business 5 extra jobs in 30 days with an AI receptionist that answers your missed calls, or we work for free until we do.</p></div><p>The owner wants more jobs. The AI receptionist is how you help them get those jobs. The offer gives them a specific result, a timeframe and a guarantee.</p><p>An irresistible offer brings together a result the buyer wants, a believable way to achieve it, a clear timeframe and a guarantee you can stand behind.</p></section><section class=\"learning-section\" data-learning-section=\"value\" data-section-title=\"What is the problem costing them?\"><h2>Understand what the problem costs</h2><p>Before you decide what to sell or charge, understand how much the problem matters to the business.</p><p>An owner might say, \u201cWe miss a few calls at night.\u201d That sounds small. But what are those missed calls worth?</p><h3>Example: missed calls at a plumbing business</h3><div class=\"b-ex\"><p>The business misses <strong>30 new customer calls a month</strong>.</p><p>If it usually turns <strong>20% of those enquiries into jobs</strong>, that is <strong>6 potential jobs</strong>.</p><p>At an average of <strong>$2,500 per job</strong>, that is <strong>$15,000 in potential work each month</strong>.</p></div><p>Now you can explain the value of the service. You are helping them win work they could be losing when nobody answers. In a survey of 1,000 US consumers, <strong>82% said they would call a competitor if a business did not answer</strong>. A missed call can become someone else\u2019s job. <a href=\"https://www.callrail.com/blog/missed-calls-cost-businesses-more-than-ever\" target=\"_blank\" rel=\"noopener\">CallRail, September 2025</a>.</p><p>Before a sales call, ask Jarvis to research your niche and service and estimate the size of the problem. It can find typical job values and relevant industry research, then show a rough calculation and the questions to ask the owner.</p><div class=\"b-prompt\"><p>Use the offer menu skill to research what this problem could cost a business in my niche. Find relevant sources, show a rough low, middle and high estimate, and give me the questions to check the numbers with the owner.</p></div><p>Use the owner\u2019s numbers: how many genuine customer enquiries they miss, how many normally become jobs and what an average job is worth. The figures above show the calculation; not every missed call will become a sale.</p><h3>How this helps you create and price the offer</h3><p>A problem costing $500 a month supports a different service and price from one costing $15,000 a month. Understanding the cost helps you decide whether the opportunity is worth pursuing and what the client could reasonably pay to fix it.</p><p>The $15,000 is potential sales revenue, not profit. You still need to understand the cost of doing those jobs, what your system can recover and what it costs you to deliver.</p><p>For an admin task, ask how many hours it takes and what that time costs. For slow quotes, ask how many customers are lost while waiting. The question stays the same: <strong>what does this problem cost the business?</strong></p><p>You will use this again in the sales module, where you work through the numbers with the owner. Here, it helps you choose a worthwhile problem to build your offer around.</p></section><section class=\"learning-section\" data-learning-section=\"awareness\" data-section-title=\"What does the buyer already understand?\"><h2>Explain the offer from the buyer\u2019s starting point</h2><p>Two owners can have the same problem but understand it differently. One knows missed calls are costing jobs. Another thinks customers will just leave a message.</p><p>This is buyer awareness: <strong>what they already know about the problem and the ways to solve it.</strong> It changes what you need to explain in your offer and marketing.</p><figure class=\"fig\"><img src=\"data:image/svg+xml;b k9IjE1MyIgZm9udC1mYW1pbHk9IidJQk0gUGxleCBNb25vJywgTWVubG8sIG1vbm9zcGFjZSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzhiOGU5YyI+TEVBRCBXSVRIIFRIRSBERUFMPC90ZXh0PgogIDx0ZXh0IHg9IjYwMCIgeT0iNjkwIiBmb250LXNpemU9IjE3IiBmaWxsPSIjOGI4ZTljIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5VbmRlcnN0YW5kIHdoYXQgdGhlIGJ1eWVyIGtub3dzLCB0aGVuIGV4cGxhaW4gdGhlIG9mZmVyIGZyb20gdGhlcmUuPC90ZXh0Pgo8L3N2Zz4K\" alt=\"Eugene Schwartz\u2019s five awareness stages: unaware, problem aware, solution aware, product aware and most aware.\"><figcaption>Eugene Schwartz\u2019s five stages of awareness. Start with what the buyer already understands.</figcaption></figure><h3>Using the AI receptionist example</h3><ol><li><strong>They have not noticed the problem.</strong> Help them see how many enquiries go unanswered and what those could be worth.</li><li><strong>They know the problem.</strong> Explain how an AI receptionist answers those calls and helps book suitable jobs.</li><li><strong>They know solutions exist.</strong> Explain what your service handles: setup, their booking rules, calendar connection and ongoing support.</li><li><strong>They are comparing providers.</strong> Show your demo, relevant results and what is included.</li><li><strong>They are ready to choose.</strong> Make the timeframe, guarantee and next step clear.</li></ol><p>You do not need to memorise these stages. Remember this: if the owner does not understand the problem yet, explain it before expecting them to want your solution. If they already understand it, spend less time explaining the basics and more time showing why your offer fits.</p></section>", "empty": false, "guide": null}, {"id": "m2-three-ways-to-find-an-offer-that-scales", "mod": "Module 2", "modname": "The Irresistible Offer", "title": "AI services you can sell", "lede": "Understand the service before choosing who to sell it to.", "body": "<section class=\"learning-section\" data-learning-section=\"start\" data-section-title=\"Explore the services\"><h2>Choose a service you want to explore</h2><p><strong>These are service categories, not identical packages.</strong> You adapt what you build to the business. Start with the result they need, then agree which tasks and connections belong in the service.</p><p>Here are eight services you can build an AI agency around. Each section explains what you sell, who might need it and what you would show a customer.</p><p>You are not choosing your final offer yet. Look for a service you understand and would like to deliver. Next, you will explore niches and match the service to a business with a worthwhile problem.</p><p>If you already know an industry well, keep it in mind as you browse. You can start with that niche and find the service it needs instead.</p></section><section class=\"learning-section\" data-learning-section=\"service-1\" data-section-title=\"AI receptionist\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>1. AI receptionist</h2><p><strong>What you sell.</strong> An AI phone agent that answers when the team cannot, takes the caller\u2019s details and books suitable jobs or appointments. The business keeps its number. Missed and after-hours calls forward to the agent, which checks the calendar and sends the team a summary.</p><p><strong>Who to sell it to.</strong> Any business that takes customer calls. Think trades, clinics, salons and other local businesses. Start with one type so the questions, bookings and demo are easy to understand.</p><p><a href=\"https://www.montra.com.au/\" target=\"_blank\" rel=\"noopener\">See a provider offering AI call and triage agents</a></p><h3>How it changes for each client</h3><p>Some businesses only need the caller\u2019s details and a message sent to the team. Others need appointment booking, call transfers, answers to routine questions or a new job created in their CRM. A webhook is a message from one system to another, such as telling the CRM to create that job after a call. Agree the actions, booking rules, connections and when a person takes over. A note-taking agent does not, by itself, deliver a promise of extra booked jobs.</p><p><strong>What to show.</strong> A caller rings the demo number, asks about a service and gets the correct next step. Show a booking and a question that needs a human.</p><div class=\"b-ex\"><p>We help local trade businesses turn missed calls into booked jobs with an AI receptionist that answers when their team cannot.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-2\" data-section-title=\"AI appointment-setting agency\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>2. AI appointment-setting agency</h2>\n<p><strong>What you sell.</strong> You install and manage the follow-up that turns enquiries into booked consultations. The client gets the system set up around their service, connected to their calendar and looked after by you. They are paying for the work and the result, not just a software login.</p>\n<p><strong>Who to sell it to.</strong> Start with one niche where consultations lead to valuable sales. The business needs enough enquiries and staff available to take the appointments. If you also generate the enquiries with ads, that is a bigger service to deliver.</p>\n<p><strong>A live agency offer.</strong> <a href=\"https://syncpromedia.com/\" target=\"_blank\" rel=\"noopener\">SyncPro Media</a> sells a dental-implant system combining Meta ads, AI follow-up and consultation booking. Its page advertises a $40K sales target in 40 days with continued free work if missed. Study how it connects the service to a result the buyer wants. Your own promise must fit what you can deliver.</p>\n<h3>How it changes for each client</h3><p>One clinic might need three questions and a booking link. Another needs follow-up across several lead sources, different calendars and a handoff for pricing questions. Agree which enquiries to handle, what makes someone suitable, when to follow up and what counts as a booked consultation.</p><p><strong>What to show.</strong> Submit a test enquiry. Show the follow-up, qualification questions and appointment reaching the right calendar.</p><div class=\"b-ex\"><p>We build and run the follow-up system that turns your dental enquiries into booked implant consultations, so your team can focus on treatment sales.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-3\" data-section-title=\"Old-lead and unsold-quote recovery\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>3. Old-lead and unsold-quote recovery</h2><p><strong>What you sell.</strong> Reconnect with people who enquired or received a quote but never bought. The system follows up, handles agreed questions and brings interested buyers back to the sales team. It tracks which opportunities become paid work.</p><p><strong>Who to sell it to.</strong> Businesses with a useful old database or unsold quotes. Roofers, builders, clinics and home-improvement companies often already have the opportunity sitting in their CRM.</p><p><strong>An agency selling it.</strong> <a href=\"https://www.mixedmediaventures.com/database-reactivation-terms-and-conditions/\" target=\"_blank\" rel=\"noopener\">Mixed Media Ventures</a> provides managed database-reactivation campaigns for clients and reseller agencies. Its <a href=\"https://www.mixedmediaventures.com/case-studies/\" target=\"_blank\" rel=\"noopener\">roofing case</a> reports 127 qualified appointments over 90 days. These are the agency\u2019s reported figures.</p><h3>How it changes for each client</h3><p>You might follow up unsold quotes, older enquiries or previous customers. These need different messages and timing. Agree which records can be contacted, what the system can say, when a sales rep takes over and how the eventual sale is tracked.</p><p><strong>What to show.</strong> Show an eligible old enquiry, the follow-up conversation and the sales-team handoff. Then show where the eventual sale would be recorded.</p><div class=\"b-ex\"><p>We\u2019ll get your roofing company 5 more jobs in 30 days from unsold estimates, or we work for free.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-4\" data-section-title=\"Outbound appointment-setting agency\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>4. Outbound appointment-setting agency</h2>\n<p><strong>What you sell.</strong> You find suitable prospects, write and run the outreach, manage replies and book qualified sales conversations for the client. You build the system in their accounts and keep improving it while their team handles sales.</p>\n<p><strong>Who to sell it to.</strong> A B2B business with a clear offer and someone able to take sales calls. Start with your chosen niche, then check whether there are enough reachable buyers and whether a sale is worth the cost of getting the meeting.</p>\n<p><strong>A live agency offer and client example.</strong> <a href=\"https://coldiq.com/implementation\" target=\"_blank\" rel=\"noopener\">ColdIQ\u2019s managed implementation</a> builds and runs outbound in accounts the client owns. Its <a href=\"https://coldiq.com/case-studies/hemlane\" target=\"_blank\" rel=\"noopener\">Hemlane case</a> explains targeting active rental-property owners and reports a 5.5% reply rate. The result is reported by the agency.</p>\n<h3>How it changes for each client</h3><p>The buyer list, channels, messages and qualification rules depend on the client\u2019s offer and audience. Some need email only; others need email, LinkedIn and human calls working together. Agree what counts as a qualified meeting and who handles replies and sales.</p><p><strong>What to show.</strong> Show the target account, relevant outreach, a reply and the handoff to the client\u2019s sales calendar. Finding contacts alone is not the finished service.</p><div class=\"b-ex\"><p>We find your ideal customers, start the conversations and book qualified sales calls for your team.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-5\" data-section-title=\"Custom AI CRM\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>5. Custom AI CRM</h2><p><strong>What you sell.</strong> Build a CRM around how the business actually works. Enquiries, quotes, jobs, documents and follow-ups sit together, with agreed tasks automated. Decide what it replaces and what it connects to before you quote.</p><p><strong>Who to sell it to.</strong> Established businesses whose team keeps copying information between spreadsheets, inboxes and software. The owner wants fewer things falling through the cracks and a clear view of each job.</p><h3>How it changes for each client</h3><p>A builder might need quotes, job progress and invoices. A training provider might need enrolments, documents and student records. Map how the team works, then agree what you will replace, what you will connect and what each person can access. Do not promise to replace every tool without checking it.</p><p><strong>What to show.</strong> Show one job moving from enquiry to quote and delivery in the same record. Show who updates it and what the team no longer needs to copy.</p><div class=\"b-ex\"><p>We build one CRM around your business so your team stops re-entering information and chasing job updates.</p></div><p><strong>My recommendation: use AI arbitrage for this one.</strong> A custom CRM is more difficult and technical than it looks. Get an experienced developer to review the requirements and scope the build before you quote the client. You manage the client and delivery; the developer handles the build.</p></section><section class=\"learning-section\" data-learning-section=\"service-6\" data-section-title=\"AI website agency\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>6. AI website agency</h2><p><strong>What you sell.</strong> Build websites for businesses that have no useful site or an outdated one. AI helps with the layout, copy and build. You organise their services, photos, contact details and enquiry flow into a site they can actually use.</p><p><strong>Who to sell it to.</strong> Local businesses whose current site makes it hard to understand the service or request a quote. Trades, clinics and professional services are easy starting points.</p><h3>How it changes for each client</h3><p>A trades business might need project photos and a quote form. A clinic might need service pages and online booking. Agree the pages, content, enquiry or booking actions, connections and who maintains the site after launch. A website does not automatically include ads or an AI receptionist.</p><p><strong>What to show.</strong> Open the site as a customer on a phone. Find the service, view the work and submit a test enquiry that reaches the business.</p><div class=\"b-ex\"><p>We build local businesses a professional website that makes it easy for customers to understand the service and request a quote.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-7\" data-section-title=\"AI content engine and editing\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>7. AI content engine and editing</h2><p><strong>What you sell.</strong> Turn the client\u2019s footage and ideas into a regular supply of edited reels, captions and other content. AI helps with scripts, cuts and captions. You check the edits and send a consistent batch for approval.</p><p><strong>Who to sell it to.</strong> Business owners, creators and brands that need content but cannot keep up with planning and editing. Start with one format and a clear monthly output.</p><h3>How it changes for each client</h3><p>One client supplies filmed videos and needs editing. Another needs ideas, scripts, filming guidance and edits. Agree the formats, number of pieces, turnaround, revisions and approval process. Posting the content is another task to include only if agreed.</p><p><strong>What to show.</strong> Show the raw footage beside one finished edit, then the batch ready for the client\u2019s approval. Be clear on how much content and how many revisions they get.</p><div class=\"b-ex\"><p>We turn your raw footage into a regular supply of edited videos, ready for you to approve and post.</p></div></section><section class=\"learning-section\" data-learning-section=\"service-8\" data-section-title=\"A niche AI automation agency\"><p class=\"section-purpose\">Understand what the client buys, who needs it and what you would show them.</p><h2>8. A niche AI automation agency</h2><p><strong>What you sell.</strong> Choose a type of business and offer a free AI audit. Find where the team loses time, money or opportunities. Recommend the most valuable first fix, show what it would do and sell the implementation. The audit opens the conversation; the build is the paid service.</p><p><strong>Who to sell it to.</strong> Owners who know AI could help but do not know what to implement. Speak to one business type so each conversation teaches you more about the same workflows.</p><p><strong>How you find the paid project.</strong> Have the owner show you a real workflow: what starts it, who handles it, where they copy information and what happens when it gets delayed. Put a cost on the problem, check the proposed fix with your developer, then show the client what you would implement. Quoting, document collection and invoice follow-up are possibilities to investigate, not ready-made offers to assume they need.</p><p><strong>An agency example.</strong> <a href=\"https://leftclick.ai/services\" target=\"_blank\" rel=\"noopener\">LeftClick</a> advertises custom automation, CRM work, onboarding and reporting, with a diagnostic call before the project. Look at the types of projects it offers and how it starts with understanding the business.</p><h3>How it changes for each client</h3><p>The audit identifies the project; it does not commit you to automating everything. One client might need document collection, another invoice follow-up. Agree one workflow, its inputs and outputs, the systems involved and the exceptions a person handles. Get the delivery person to check the build before quoting.</p><p><strong>What to show.</strong> Walk through a real task with the owner, identify the problem and show the proposed fix. You quote that implementation after checking it with the delivery person.</p><div class=\"b-ex\"><p>Know you need AI but not where to start? We\u2019ll audit your business for free and show you the first thing we would automate.</p></div><p>These are offer examples to adapt. Set your target, timing and guarantee around what you can deliver. A straightforward receptionist setup can take 2 to 5 working days once the details and access are ready. Start with one niche, identify a worthwhile problem and use Jarvis to develop the service and offer together.</p></section>", "empty": false, "guide": null}, {"id": "m2-choose-your-niche", "mod": "Module 2", "modname": "The Irresistible Offer", "title": "Choose Your Niche", "lede": "Explore 25 types of business and choose who you want to help.", "body": "<section class=\"learning-section\" data-learning-section=\"choose\" data-section-title=\"How to choose\"><h2>A niche is the type of customer you serve</h2><p>\u201cPlumbing businesses\u201d is a niche. \u201cAI receptionist\u201d is a service. Your offer connects the two: answering missed calls for plumbing businesses so they can book more jobs.</p><p>Below are 25 niches to explore, with several services and an example problem you could investigate for each. Most services can work across several niches, and one niche can buy several services. These suggestions are not limits. Choose based on what the business needs and can gain from it, not the industry label alone.</p><h3>Two ways to start</h3><p><strong>You already like a service:</strong> look for a niche where that service solves a valuable problem. Compare how other agencies serve those businesses and whether there is a gap in the location, customer type or service they provide.</p><p><strong>You already know a niche:</strong> start there. For a custom automation agency, speak to owners about how their business works before deciding what to build. An AI audit is a conversation where you find useful improvements, then recommend and quote the specific project.</p><h3>What makes a niche a good fit?</h3><p>Look for businesses that can gain enough from the result to pay for your service. A business selling valuable jobs, or handling lots of customers, may have more to gain from a small improvement.</p><p>Your knowledge of the industry also helps. Do you understand the work? Can you explain the problem in their language? Is there a clear reason they would want it fixed?</p><p>Fewer competing providers can create an opening, but it only matters if customers want the service. Choose the service and niche together, then check the problem with real businesses. Staff count alone does not tell you what a business can afford.</p></section><section class=\"learning-section\" data-learning-section=\"group-1\" data-section-title=\"Trades and home services\"><h2>Trades and home services</h2><h3>Plumbers</h3><p><strong>Services that could fit:</strong> AI receptionist, website, old-lead follow-up or custom CRM.<br><strong>One problem to explore:</strong> After-hours enquiries when the team cannot answer.</p><h3>Electricians</h3><p><strong>Services that could fit:</strong> AI receptionist, website, quote follow-up or custom automation.<br><strong>One problem to explore:</strong> New customer calls missed while working on site.</p><h3>Roofers</h3><p><strong>Services that could fit:</strong> Unsold-quote recovery, AI receptionist, website or custom CRM.<br><strong>One problem to explore:</strong> Estimates sent to homeowners who have not decided.</p><h3>HVAC companies</h3><p><strong>Services that could fit:</strong> Customer reactivation, AI receptionist, enquiry follow-up or custom CRM.<br><strong>One problem to explore:</strong> Previous customers who may need another service or maintenance visit.</p><h3>Landscapers</h3><p><strong>Services that could fit:</strong> Website, AI receptionist, quote follow-up or content engine.<br><strong>One problem to explore:</strong> Customers need to see past work and request a quote.</p></section><section class=\"learning-section\" data-learning-section=\"group-2\" data-section-title=\"Clinics and appointment businesses\"><h2>Clinics and appointment businesses</h2><h3>Dental clinics</h3><p><strong>Services that could fit:</strong> AI receptionist, enquiry follow-up, customer reactivation or website.<br><strong>One problem to explore:</strong> Treatment enquiries that do not reach a consultation.</p><h3>Physiotherapy clinics</h3><p><strong>Services that could fit:</strong> AI receptionist, enquiry follow-up, customer reactivation or website.<br><strong>One problem to explore:</strong> Patients trying to book while reception is busy.</p><h3>Veterinary practices</h3><p><strong>Services that could fit:</strong> AI receptionist, website or custom admin automation.<br><strong>One problem to explore:</strong> Routine booking calls that interrupt the front desk; urgent cases need a human.</p><h3>Med spas</h3><p><strong>Services that could fit:</strong> Enquiry follow-up, AI receptionist, content engine or website.<br><strong>One problem to explore:</strong> People asking about treatments but not booking a consultation.</p><h3>Gyms and fitness studios</h3><p><strong>Services that could fit:</strong> Old-lead recovery, enquiry follow-up, content engine or website.<br><strong>One problem to explore:</strong> People who enquired about joining but never started.</p></section><section class=\"learning-section\" data-learning-section=\"group-3\" data-section-title=\"Property and construction\"><h2>Property and construction</h2><h3>Real estate agencies</h3><p><strong>Services that could fit:</strong> Content engine, enquiry follow-up, AI receptionist or custom CRM.<br><strong>One problem to explore:</strong> Agents with property footage but too little time to edit it.</p><h3>Property managers</h3><p><strong>Services that could fit:</strong> AI receptionist, custom CRM, website or maintenance-request automation.<br><strong>One problem to explore:</strong> Maintenance requests copied between inboxes and job systems.</p><h3>Residential builders</h3><p><strong>Services that could fit:</strong> Custom CRM, quote follow-up, website or AI receptionist.<br><strong>One problem to explore:</strong> Quotes, jobs and updates spread across different tools.</p><h3>Renovation companies</h3><p><strong>Services that could fit:</strong> Quote recovery, AI receptionist, website or content engine.<br><strong>One problem to explore:</strong> Customers with outstanding renovation proposals.</p><h3>Commercial cleaners</h3><p><strong>Services that could fit:</strong> Outbound appointment setting, website, AI receptionist or custom CRM.<br><strong>One problem to explore:</strong> Finding and starting conversations with businesses needing a cleaning provider.</p></section><section class=\"learning-section\" data-learning-section=\"group-4\" data-section-title=\"Professional and B2B services\"><h2>Professional and B2B services</h2><h3>Recruitment agencies</h3><p><strong>Services that could fit:</strong> Outbound appointment setting, custom CRM, content engine or custom automation.<br><strong>One problem to explore:</strong> Repeated candidate and client admin across several systems.</p><h3>Accounting firms</h3><p><strong>Services that could fit:</strong> Document automation, AI receptionist, website or content engine.<br><strong>One problem to explore:</strong> Chasing client documents and tracking what is still missing.</p><h3>Law firms</h3><p><strong>Services that could fit:</strong> AI receptionist, enquiry follow-up, website or custom intake automation.<br><strong>One problem to explore:</strong> New enquiries that need details collected and routing to the right person.</p><h3>IT service providers</h3><p><strong>Services that could fit:</strong> Outbound appointment setting, custom CRM, website or content engine.<br><strong>One problem to explore:</strong> Finding businesses suited to their support service.</p><h3>Training providers</h3><p><strong>Services that could fit:</strong> Enquiry follow-up, custom CRM, website or admin automation.<br><strong>One problem to explore:</strong> Enquiries, enrolments and learner records handled in separate places.</p></section><section class=\"learning-section\" data-learning-section=\"group-5\" data-section-title=\"Other service businesses\"><h2>Other service businesses</h2><h3>Auto repair shops</h3><p><strong>Services that could fit:</strong> AI receptionist, customer reactivation, website or enquiry follow-up.<br><strong>One problem to explore:</strong> Booking requests while the team is in the workshop.</p><h3>Pest control companies</h3><p><strong>Services that could fit:</strong> AI receptionist, website, customer reactivation or enquiry follow-up.<br><strong>One problem to explore:</strong> Customers need clear service information and an easy quote request.</p><h3>Pet groomers</h3><p><strong>Services that could fit:</strong> AI receptionist, website, customer reactivation or content engine.<br><strong>One problem to explore:</strong> Booking calls missed while handling animals.</p><h3>Coaches and consultants</h3><p><strong>Services that could fit:</strong> Content engine, enquiry follow-up, website or custom CRM.<br><strong>One problem to explore:</strong> Long videos that could become a regular supply of short clips.</p><h3>Wedding and event venues</h3><p><strong>Services that could fit:</strong> Enquiry follow-up, AI receptionist, content engine or website.<br><strong>One problem to explore:</strong> People asking about dates and packages but not booking a viewing.</p></section><section class=\"learning-section\" data-learning-section=\"pick\" data-section-title=\"Choose your starting point\"><h2>Choose one service and one niche</h2><p>You do not need to be certain forever. Choose one combination to investigate so Jarvis can research something specific.</p><div class=\"b-prompt\"><p>Use the offer menu skill to help me choose one service and niche. Ask about my experience, interests, location and any service I already like. Compare up to three options and help me choose one.</p></div><p>When you have chosen, continue to the finished offer example. Then you will build yours step by step.</p></section>", "empty": false, "guide": null}, {"id": "m2-write-the-offer", "mod": "Module 2", "modname": "The Irresistible Offer", "title": "What an Irresistible Offer Looks Like", "lede": "See a complete roofing offer, why it works and where you use it.", "body": "<section class=\"learning-section\" data-learning-section=\"example\" data-section-title=\"The finished offer\"><p class=\"section-purpose\">See one complete offer before writing yours.</p><p>Jarvis uses the offer creation skill to turn your buyer, problem and solution into six lines. First, see the finished example so you know what you are building.</p><p>An offer tells the buyer what you will do for them. Here is a roofing recovery offer written in the same six lines you will use for yours.</p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDY0MCIgZm9udC1mYW1pbHk9IidJbnN0cnVtZW50IFNhbnMnLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNjQwIiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleH ng recovery offer: roofing companies, 5 more jobs in 30 days, monthly target, work free if missed, working demo, Estimate Recovery System.\"><figcaption>A worked example. The target and guarantee need checking before you sell it.</figcaption></figure>\n<p>The roofer wants more paid jobs. The system follows up quotes they have already sent, so the offer does not depend on buying more ad traffic. The number and guarantee need a large enough pipeline and a delivery plan behind them.</p>\n<h2>Why this makes it easy to say yes</h2><p>You are offering the thing the roofer actually wants: more paid jobs. There is a specific target, a clear timeframe and a guarantee that reduces their risk.</p><p>They can see how it works: follow up quotes they have already sent. They do not need to spend more on ads to create another batch of enquiries. When the target is realistic for their pipeline and they believe you can deliver it, the offer becomes an easy decision.</p></section><section class=\"learning-section\" data-learning-section=\"use\" data-section-title=\"Where do you use your offer?\"><h2>Where do you actually use your offer?</h2><p>Your offer is the promise you repeat throughout your marketing and sales. The wording can change to fit the format, but the result you promise stays the same.</p><ul><li><strong>Landing page:</strong> the headline says what they get; the subheadline explains how.</li><li><strong>Ads:</strong> lead with the result and give them a reason to learn more.</li><li><strong>Emails and DMs:</strong> explain who you help and what you can do for them.</li><li><strong>VSL:</strong> explain the problem, the result and how your service delivers it.</li><li><strong>Sales calls and proposals:</strong> explain what you will do for that business and the terms you agree.</li></ul><div class=\"b-ex\"><p><strong>Headline:</strong> We\u2019ll get you 5 more roofing jobs in 30 days. Or we work for free.</p><p><strong>Subheadline:</strong> We build and run an AI follow-up system that turns your unsold roof estimates into paid jobs, without increasing your ad spend.</p></div><p>That is the shape of the roofing example. The number needs a suitable pipeline and a delivery plan behind it.</p><p>The headline sells the result. The subheadline explains the mechanism. The VSL explains the service in more depth. Your application finds the right businesses, then the booking page gets them onto a call.</p></section>", "empty": false, "guide": null}, {"id": "m2-create-your-offer", "mod": "Module 2", "modname": "The Irresistible Offer", "title": "Create Your Offer", "lede": "Use these four prompts in order to finish your offer with Jarvis.", "body": "<p>Keep this in the same Jarvis project with your skill pack loaded. Jarvis uses your earlier answers, researches the service and writes the offer. You choose what to keep.</p><section class=\"learning-section\" data-learning-section=\"buyer\" data-section-title=\"1. Choose the buyer\"><p class=\"section-purpose\">Start with who you can understand and reach.</p><h2>Choose who you want to help</h2><p>Start with a business you know or can reach. If you already picked a service, tell Jarvis and find the buyer who needs it. If you have no experience, say that. Jarvis should ask about your interests, access and location before recommending options.</p><div class=\"b-ex\"><p><strong>You:</strong> \u201cI worked in a roofing office. I want to work with residential roofers in Dallas.\u201d</p><p><strong>Choice:</strong> Residential roofing company owners in Dallas. That is who the rest of the example is about.</p></div><div class=\"b-prompt\"><p>Use the offer menu skill to help me choose one niche from my background, interests and any service I already have in mind. Ask what you need, then save my chosen buyer and location.</p></div><p><strong>Before continuing:</strong> answer Jarvis\u2019s questions and choose one buyer. Don\u2019t move on with a list of five niches.</p></section><section class=\"learning-section\" data-learning-section=\"problem\" data-section-title=\"2. Find the problem\"><p class=\"section-purpose\">Use that buyer to choose one problem and service.</p><h2>Find a problem they would pay to solve</h2><p>Now Jarvis researches that buyer and matches a useful service to the problem. You can use the service examples, an offer found elsewhere or deeper custom research.</p><div class=\"b-ex\"><p><strong>Problem to investigate:</strong> The roofer has unsold estimates but no consistent follow-up.</p><p><strong>Service:</strong> Follow up eligible estimates and bring interested homeowners back to the sales team.</p><p><strong>Why it matters:</strong> They already spent time winning the enquiry and preparing the quote.</p></div><div class=\"b-prompt\"><p>Use the offer menu skill to research my chosen buyer, recommend one worthwhile problem and service with real examples. Show how to estimate what the problem costs using the owner\u2019s numbers, and explain what I need to confirm with owners.</p></div><p><strong>Before continuing:</strong> choose the problem you can explain. Public research gives you a starting point; owner conversations check whether it is real for them.</p></section><section class=\"learning-section\" data-learning-section=\"service\" data-section-title=\"3. Define the service\"><p class=\"section-purpose\">Know the delivery behind the promise.</p><h2>Know what the service actually does</h2><p>Get clear on the workflow and delivery before you promise a result.</p><div class=\"b-ex\"><p><strong>The roofing service:</strong> Find eligible unsold estimates, send approved follow-up, handle agreed questions and pass interested homeowners to the sales rep. The rep still answers technical questions, closes and delivers the roofing job.</p><p><strong>Check before selling:</strong> access to the CRM, the usable pipeline, the delivery cost and whether your team or developer can build it.</p></div><div class=\"b-prompt\"><p>Use the offer menu skill and my saved decisions to explain the problem, workflow, client responsibilities and delivery route in plain language. Save the service brief and flag the facts we must check before promising a result.</p></div><p><strong>Before continuing:</strong> explain the service in two sentences. Take technical gaps to your developer or technical CSM.</p></section><section class=\"learning-section\" data-learning-section=\"offer\" data-section-title=\"4. Write the offer\"><p class=\"section-purpose\">Turn the saved service brief into the six lines.</p><h2>Turn that service into the offer</h2><p>The offer creation skill now uses the saved brief. You should not need to explain the whole business again.</p><div class=\"b-ex\"><p><strong>Niche:</strong> Residential roofers in Dallas with eligible unsold estimates.<br><strong>Outcome:</strong> Five more paid roofing jobs.<br><strong>Timeframe:</strong> Within 30 days of campaign launch.<br><strong>Risk reversal:</strong> Work free until the agreed target is reached.<br><strong>Authority / proof:</strong> A working demonstration of the follow-up workflow.<br><strong>Unique mechanism:</strong> The Estimate Recovery System.</p></div><div class=\"b-prompt\"><p>Use my saved service brief and the offer creation skill to write my six lines. Reuse my decisions and mark anything we still need to confirm.</p></div><p><strong>Before continuing:</strong> make sure the offer matches the service you understand and can deliver. Ask Jarvis to save the chosen version.</p><p>Then <a href=\"#m5-build-the-page\" data-go=\"m5-build-the-page\">build your landing page</a> from that same offer. The headline sells the result; the subheadline explains how.</p></section>", "empty": false, "guide": null}, {"id": "m5-what-the-funnel-is-actually-for", "mod": "Module 3", "modname": "Funnels", "title": "Website vs landing page", "lede": "Your campaign page speaks to one buyer about one offer.", "body": "<p>A website introduces the business: who you are, what you do and the services you offer. A landing page gives one specific buyer a reason to take one specific action.</p>\n<table class=\"tbl\"><tr><th>Business website</th><th>Offer landing page</th></tr><tr><td>Explains the brand and its services.</td><td>Explains one result for one type of business.</td></tr><tr><td>Different visitors explore different pages.</td><td>The visitor follows one clear path to apply.</td></tr></table>\n<p>If you serve med spas, dentists and chiropractors, each can have its own offer page. The language, workflow and problem can be specific to that buyer.</p>\n<p>For the booked-call funnel we are building, the ad gets their attention and the landing page makes the offer clear. The headline, example and next step should feel like the same conversation.</p>", "empty": false, "guide": null}, {"id": "m5-build-the-page", "mod": "Module 3", "modname": "Funnels", "title": "Build your complete booked-call funnel", "lede": "Show the right owner your offer and give them a clear path to apply and book.", "body": "<!-- module-context:start -->\n<p>You are building the route from someone seeing your offer to becoming a lead and booking a sales call. Each page has one job, and the information stays connected in your CRM.</p>\n<p>By the end, you will be able to follow a test enquiry through the pages and see the appointment in your workspace.</p>\n<!-- module-context:end -->\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDI3MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJUaGUgcGF0aCBmcm9tIGludGVyZXN0IHRvIGEgYm9va2VkIGNvbnZlcnNhdGlvbiI+PHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iMjcwIiBmaWxsPSIjZmJmYmZjIi8+PHRleHQgeD0iMzYiIHk9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNSIgZmlsbD0iIzBlMTAxNiI+VGhlIHBhdGggZnJvbSBpbnRlcmVzdCB0byBhIGJvb2tlZCBjb252ZXJzYXRpb248L3RleHQ+PHJlY3QgeD0iMzYuMCIgeT0iNzgiIHdpZHRoPSIyNjEuMCIgaGVpZ2h0PSIxNDUiIHJ4PSIxMCIgZmlsbD0iI2VmZWNmYiIgc3Ryb2tlPSIjZD 48dGV4dCB4PSIxMDMzLjUiIHk9IjE1OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPkNvbmZpcm0gYW5kIHByZXBhcmU8L3RleHQ+PC9zdmc+\" alt=\"Landing page, application, booked call, confirmation\"><figcaption>An application and a booked appointment are separate steps.</figcaption></figure>\n<h2>The landing page makes the offer clear</h2>\n<p>Your headline tells the owner what result you offer. The line underneath explains how. Show the problem they recognise, the system that solves it and a relevant demonstration or genuine proof.</p>\n<div class=\"b-ex\"><p>For the roofing example, the result is more paid jobs from estimates already sent. Show how an unsold estimate gets followed up and reaches the roofer when the customer is ready to speak.</p></div>\n<p>A short video can explain this, but the page should still make sense without it. Give them one next step: apply to discuss their business.</p>\n<h2>The application gets them to explain their situation</h2>\n<p>Ask a few useful questions about the business and the problem. Then collect their contact details. When someone applies, they are telling you why this matters to them. Those answers belong in the sales brief.</p>\n<h2>The booking page gets the time agreed</h2>\n<p>A suitable prospect chooses an available time. The congratulations message acknowledges that step and sends them to the preparation page. A submitted form alone does not mean there is an appointment.</p>\n<h2>The confirmation page gets them ready</h2>\n<p>Acknowledge their booking, show the attendance-confirmation action and explain what to prepare. Use the actual call time and calendar invitation.</p>\n<div class=\"b-prompt\"><p>Build my booked-call funnel from my saved offer, including the application, booking and confirmation pages.</p></div>\n<p>Send a test enquiry and book a time. Open your CRM and check that the enquiry and appointment are together.</p>", "empty": false, "guide": null}, {"id": "m5-get-them-to-show-up-ready", "mod": "Module 3", "modname": "Funnels", "title": "Get your prospect to confirm and prepare", "lede": "Use the page after booking to build confidence and get the appointment confirmed.", "body": "<p>They have booked a call. Keep the momentum going. Show them what the conversation will cover, get them to confirm attendance and give them something useful to look at beforehand.</p>\n<h2>Put the two actions beside the video</h2>\n<ol><li>Open the email from your actual sender and use its attendance-confirmation button or reply.</li><li>Accept the calendar invitation or save the appointment using the calendar button.</li></ol>\n<p>Use the instructions your connected system actually provides. The appointment being booked, an attendance reply and a calendar acceptance are separate actions.</p>\n<h2>Your confirmation video</h2>\n<div class=\"b-script\"><p>Hey, thanks for booking your [call name]. We are going to look at [the problem] in your business and whether [your service] is the right way to get you [the outcome].</p><p>Before that, there are two quick things I need you to do. Open the email from [sender] and click [the attendance button]. Check spam or promotions if it has not appeared. Then accept the calendar invitation so the appointment is in your diary. Check the time and timezone while you are there.</p><p>Perfect. On the call, I want to understand how [their workflow] runs today. Where does it get held up? What is still being done manually? What would a better result look like for your team?</p><p>Then I can show you how the system would fit and explain the next step. You do not need to understand the technical side before we speak.</p><p>Come with the real picture of how things work now. If someone else needs to be involved in the decision, let me know. Join somewhere quiet where you can see the screen, because I will be showing you [the relevant demonstration].</p><p>Below this video I have put [your genuine demo or build breakdown]. Have a look before we speak. It will help you understand what we can do and the questions you want to ask.</p><p>If your plans change, use [your actual rescheduling process] and give me as much notice as you can. Otherwise, I will see you at your booked time.</p></div>\n<h2>Give them useful proof</h2>\n<p>A real build breakdown, a callable demo or a client review helps the owner understand what they are coming to discuss. Start with a working demonstration if you have no client results yet. Add real reviews and case studies as you earn them.</p>\n<div class=\"b-prompt\"><p>Create my post-booking confirmation page and video script from my saved offer and actual booking process.</p></div>\n<p>Check the sender, button wording and calendar action against your own booking.</p>", "empty": false, "guide": null}, {"id": "m5-the-follow-up-that-runs-without-you", "mod": "Module 3", "modname": "Funnels", "title": "Your booking confirmation and reminders", "lede": "Jarvis follows the appointment while you prepare for the conversation.", "body": "<p>The booking is the start of the conversation. Confirmation and reminders keep it moving until the owner joins you.</p>\n<h2>What happens around the appointment</h2>\n<p>The booking creates the appointment record. The confirmation message gives them the time, preparation page and attendance action. Reminders use that appointment, and the sequence changes when they confirm, cancel or reschedule.</p>\n<p>If they book close to the meeting, the system uses the remaining reminders. They should never receive a pile of old messages at once.</p>\n<h2>A personal check-in on the morning</h2>\n<p>If they have not confirmed, I like a simple message early enough for them to reply.</p>\n<div class=\"b-script\"><p>Hey [name], it is [your name]. I am just going through my calendar for today. I have got you down for [time], but have not seen your confirmation come through. Can I count on you being there?</p></div>\n<p>It feels personal, names the appointment and asks for a clear commitment. If they have already confirmed, send the preparation reminder instead.</p>\n<p>You can mention other confirmed appointments when that is true. The commitment question works without inventing a busy calendar.</p>\n<h2>Keep the reply connected</h2>\n<p>A reply should stay with the lead. A cancellation stops the old reminders. A reschedule uses the new time. If a reply needs your attention, it should appear with the next action.</p>\n<div class=\"b-prompt\"><p>Set up my booking confirmation and reminders using my saved funnel and connected calendar, including the morning-of check-in for unconfirmed calls.</p></div>\n<p>Run one test booking through the sequence and check the messages arrive with the right details.</p>", "empty": false, "guide": null}, {"id": "m3-the-whole-system-on-one-page", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "The Whole System on One Page", "lede": "Six steps, one list, one message on every channel. I want you to see the whole thing before you build any one piece of it.", "body": "<!-- module-context:start -->\n<p>In this module, you\u2019ll use Jarvis to find businesses that fit your offer, identify the right person and prepare your outreach. You\u2019ll learn how to use calls, email, LinkedIn and messages together.</p>\n<p>You\u2019re turning your offer into real conversations with business owners. Each message and follow-up should build on the last, with everything tracked in your CRM.</p>\n<p><strong>By the end, you\u2019ll have a researched prospect list, relevant outreach, call scripts and a follow-up plan ready to run. Outreach and paid ads are two acquisition routes; you can start with either.</strong></p>\n<!-- module-context:end -->\n<p>Ads are how I have always got clients. Outreach is the system we run on our own offer, written down step by step so you can run it on yours. You can start with manual outreach before adding paid tools.</p>\n\n<h2>Why speak with owners</h2>\n<p>Speaking with owners helps you hear how they describe the problem, what they have tried and whether your offer lands. Outreach lets you start those conversations directly. You can also start with paid ads; either way, track the conversations and use what you learn to improve the offer.</p>\n\n<h2>The six steps</h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDU2MCIgZm9udC1mYW1pbHk9IidJbnN0cnVtZW50IFNhbnMnLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNTYwIiBmaWxsPSIjZmZmZmZmIi8+CiAgPGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjEwIiBtYXJrZXJIZWlnaHQ9IjEwIiByZWZYPSI4IiByZWZZPSI1IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDEwIDUgTDAgMTAgeiIgZmlsbD0iIzhiOGU5YyIvPjwvbWFya2VyPjwvZGVmcz4KICA8dGV4dCB4PSI2MCIgeT0iNTQiIGZvbnQtZmFtaWx5PSInRnJhdW5jZXMnLCBHZW9yZ2lhLCBzZXJpZiIgZm9udC1zaXplPSIyNiIgZm9udC13ZWlnaHQ9IjYwMCIgZmlsbD0iIzBlMTAxNiI+T25lIGxpc3QsIG9uZSBtZXNzYWdlLCBldmVyeSBjaGFubmVsLiBKYXJ2aXMgZG9lcyBzdGVwcyAxIHRvIDUuIFlvdSBkbyA2LjwvdGV4dD4KICA8IS0tIHJvdyAxOiB0aHJlZSBib3hlcyAtLT4KICA8cmVjdCB4PSI2MCIgeT0iMTEwIiB3aWR0aD0iMzMwIiBoZWlnaHQ9IjEyMCIgcng9IjEwIiBmaWxsPSIjZWZlY2ZiIiBzdHJva2U9IiM0YjJmYzQiIHN0cm9rZS13aWR0aD0iMS41Ii8+CiAgPHRleHQgeD0iODAiIHk9IjEzOCIgZm9udC1mYW1pbHk9IidJQk0gUGxleCBNb25vJywgTWVubG8sIG1vbm9zcGFjZSIgZm9udC1zaXplPSIxMyIgbGV0dGVyLXNwYWNpbmc9IjIiIGZpbGw9IiM0YjJmYzQiPjEuIFRIRSBBQ0NPVU5UPC90ZXh0PgogIDx0ZXh0IHg9IjgwIiB5PSIxNzAiIGZvbnQtc2l6ZT0iMjIiIGZvbnQtd2VpZ2h0PSI2MDAiIGZpbGw9IiMwZTEwMTYiPldobyBleGFjdGx5IHlvdSB3YW50PC90ZXh0PgogIDx0ZXh0IHg9IjgwIiB5PSIxOTgiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1YTVkNmIiPkluZHVzdHJ5LCBwbGFjZSwgc2l6ZSwgcGFpbjwvdGV4dD4KICA8bGluZSB4MT0iMzkwIiB5MT0iMTcwIiB4Mj0iNDMwIiB5Mj0iMTcwIiBzdHJva2U9IiM4YjhlOWMiIHN0cm9rZS13aWR0aD0iMS41IiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+CiAgPHJlY3QgeD0iNDM1IiB5PSIxMTAiIHdpZHRoPSIzMzAiIGhlaWdodD0iMTIwIiByeD0iMTAiIGZpbGw9IiNlZmVjZmIiIHN0cm9rZT0iIzRiMmZjNCIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4KICA8dGV4dCB4PS ljIj5Db3N0OiBub3RoaW5nIGJ1dCB5b3VyIHRpbWUuIFBhaWQgZGF0YSB0b29scyBjb21lIGxhdGVyLCBvbmx5IHdoZW4geW91IGFyZSBwYXN0IGEgZmV3IGh1bmRyZWQgYWNjb3VudHMgYSBtb250aC48L3RleHQ+Cjwvc3ZnPgo=\" alt=\"Six boxes in a loop. One, the account. Two, the list from Google Maps. Three, Jarvis reads every website. Four, the owner from a free business registry. Five, rank and write one message. Six, you run it across every channel. Outcome: booked first calls in your CRM.\"><figcaption>Jarvis does the digging in steps one to five. Step six is you.</figcaption></figure>\n<ol>\n<li><strong>Tell Jarvis the account.</strong> Not \"plumbers\". Plumbing businesses in Brisbane with three or more vans, who miss calls because everyone is on the tools. Industry, place, size, pain.</li>\n<li><strong>Jarvis builds the list from Google Maps.</strong> Name, phone, address, website, hours, rating, reviews. Three hundred businesses in an afternoon, on Google's free allowance, in any country.</li>\n<li><strong>Jarvis reads every website.</strong> Owner's name, email, how they take bookings, rough staff count, and the signs of your pain: no online booking, no after hours answer, a job ad for an admin.</li>\n<li><strong>Jarvis finds the owner.</strong> Every country has a free business registry: ABN Lookup, Companies House, your state's business search. You call a name, not a switchboard. Top accounts with nothing in the registry, you look up on LinkedIn by hand.</li>\n<li><strong>Jarvis ranks them and writes the message.</strong> Pain signs, size, reachability. You read the top thirty yourself. Then one message, one angle, adapted to each channel: call script, email, LinkedIn note, DM.</li>\n<li><strong>You run it.</strong> Dial the listed number. Email from your own business mailbox through your CRM. LinkedIn and DMs by hand. Three touches a week for three weeks, every touch logged. A reply, a booking or a \"stop\" ends the sequence on every channel.</li>\n</ol>\n\n<h2>The numbers</h2>\n<p>Two five figure deals a month needs about seven first calls. If a good list books one call in twenty, that is around 140 accounts a month, so Jarvis ranks 400 to 600 raw accounts. Track accounts, conversations, first calls booked, attended, second calls, deals won, cash in. Your CRM shows it on one card.</p>\n\n<h2>Paid data tools</h2>\n<p>They find more emails and they are faster past a few hundred accounts a month. Nobody gives you reliable mobiles, so you dial the listed number either way. Past a few hundred accounts a month, upgrade to a paid data tool. Until then, do not spend a dollar on data.</p>\n\n<h2>The rules</h2>\n<ul>\n<li>A scraped mobile number is not permission to text it. SMS only where your country's rules allow it and the person has a reason to hear from you.</li>\n<li>Every email has your real name, your business and a way to opt out.</li>\n<li>A reply, a booking or a \"stop\" ends the sequence everywhere, the same day.</li>\n<li>Cold email from one business inbox is fine at this volume. Never buy a list and blast it. That burns a domain you need for the next five years.</li>\n</ul>", "empty": false, "guide": null}, {"id": "m3-build-the-account-list", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "Build the Account List", "lede": "The list is the campaign. A sharp list of two hundred beats a scraped pile of ten thousand, and Jarvis builds it for you from Google Maps.", "body": "", "empty": true, "guide": ["Module 4: Outreach", "Find your first leads"]}, {"id": "m3-enrich-it", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "Enrich It", "lede": "Names, emails, the owner and a reason to call this week. This is what makes your outreach stop sounding cold.", "body": "", "empty": true, "guide": null}, {"id": "m3-cold-calling", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "Cold Calling", "lede": "The fastest way to find out whether your offer is any good. Thirty dials will teach you more than a week of thinking.", "body": "", "empty": true, "guide": null}, {"id": "m3-linkedin", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "LinkedIn", "lede": "Where the person who signs actually reads things. Slower than the phone, warmer than email.", "body": "", "empty": true, "guide": null}, {"id": "m3-dm-outreach", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "DM Outreach", "lede": "Instagram and Facebook, where owners read their own messages. Short, human, no pitch in the first message.", "body": "", "empty": true, "guide": null}, {"id": "m3-email-and-sms", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "Email and SMS", "lede": "The cheapest touch you own and the easiest one to ruin. Get delivery right first, then worry about volume.", "body": "", "empty": true, "guide": ["Module 4: Outreach", "Connect your email and Approve your first emails"]}, {"id": "m3-package-it-all-together", "mod": "Module 4", "modname": "Client Acquisition: Outreach", "title": "Package It All Together", "lede": "One prospect, every channel, one pipeline. This is what separates someone running a system from someone doing random outreach.", "body": "", "empty": true, "guide": null}, {"id": "m4-how-ads-actually-work", "mod": "Module 5", "modname": "Client Acquisition: Paid Ads", "title": "How paid ads grow your AI business", "lede": "Put one clear offer in front of many suitable business owners.", "body": "<!-- module-context:start -->\n<p>You are learning how to bring business owners to your offer through paid ads. Jarvis carries the offer, creative and results together so you can make better decisions as you test.</p>\n<p>You will understand what makes an ad relevant, how the economics work and how to turn what the market responds to into the next creative.</p>\n<!-- module-context:end -->\n<p>A sales call is one conversation with one business. An ad can put the same offer in front of many owners. That is why I love paid ads: once the offer and acquisition economics work, you have a way to buy more opportunities to speak.</p>\n<h2>Different angles, the same offer</h2>\n<p>An angle is one way of explaining why the owner should care. Keep the offer the same and test different reasons to pay attention.</p>\n<table class=\"tbl\"><tr><th>Angle</th><th>Roofing follow-up example</th></tr><tr><td>Problem</td><td>What happens to estimates that customers never answer?</td></tr><tr><td>Outcome</td><td>Turn suitable unsold estimates into conversations about booked work.</td></tr><tr><td>Objection</td><td>You already sent one follow-up. What happens after that?</td></tr><tr><td>Mechanism</td><td>Watch an old estimate go through the follow-up workflow.</td></tr><tr><td>Proof</td><td>Show the actual demo or a result you have permission to share.</td></tr></table>\n<p>Name the business owner you are speaking to early. Their problem, language and workflow make the ad relevant. Meta still needs real response data to learn who responds; the opening line does not guarantee who sees or buys it.</p>\n<h2>Know what a customer can cost</h2>\n<p>Start with what you collect and what it costs to deliver. Include development, software, fees and the support you are responsible for. Then decide how much can go into acquisition while leaving enough to make the deal worthwhile.</p>\n<div class=\"b-ex\"><p>Made up numbers, to show the shape. You collect $10,000. Delivery costs $3,000 and you allow $1,000 for other costs and support. That leaves $6,000 before acquisition and profit. Spending $5,000 to win the client would leave $1,000, not $5,000.</p></div>\n<p>A business with proven recurring revenue can make different decisions about payback. Starting out, use a test budget you can afford to lose without needing the next sale to rescue it.</p>\n<h2>Let the results guide the next creative</h2>\n<p>Jarvis keeps the ad, angle and results connected. A cheap lead is useful when it becomes a suitable conversation. Look through to qualified calls, attendance, proposals and paid clients before calling an angle a winner.</p>\n<p>I go deeper into creative and economics on the ads walkthrough. Keep the decision simple: what did we test, what happened and what should we change next?</p>", "empty": false, "guide": null}, {"id": "m4-the-ad-skills", "mod": "Module 5", "modname": "Client Acquisition: Paid Ads", "title": "Create video and static ads with Jarvis", "lede": "Use your offer to create scripts, filming ideas and finished creative.", "body": "<p>Your offer and research are already saved. Ask Jarvis to create ads from that context. Each script should test a clear angle and bring the owner back to the same offer.</p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDI3MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJKYXJ2aXMga2VlcHMgdGhlIHdvcmsgY29ubmVjdGVkIj48cmVjdCB3aWR0aD0iMTIwMCIgaGVpZ2h0PSIyNzAiIGZpbGw9IiNmYmZiZmMiLz48dGV4dCB4PSIzNiIgeT0iNDIiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjI1IiBmaWxsPSIjMGUxMDE2Ij5KYXJ2aXMga2VlcHMgdGhlIHdvcmsgY29ubmVjdGVkPC90ZXh0PjxyZWN0IHg9IjM2LjAiIHk9Ijc4IiB3aWR0aD0iMjYxLjAiIGhlaWdodD0iMTQ1IiByeD0iMTAiIGZpbGw9IiNlZmVjZmIiIHN0cm9rZT0iI2Q4Y2ZlZSIvPjx0ZXh0IHg9IjE2Ni41IiB5PSIxMjUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjIyIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0iIzRiMmZjNCI+Q3JlYXRlPC90ZXh0Pjx0ZXh0IHg9IjE2Ni41IiB5PSIxNTkiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNWE1ZDZiIj5PZmZlciBhbmQgYW5nbGVzPC90ZXh0Pjx0ZXh0IHg9IjMxMS4wIiB5PSIxNTMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM1YTVkNmIiPuKGkjwvdGV4dD48cmVjdCB4PSIzMjUuMCIgeT0iNzgiIHdpZHRoPSIyNjEuMCIgaGVpZ2h0PSIxNDUiIHJ4PSIxMCIgZmlsbD0iI2VmZWNmYiIgc3Ryb2tlPSIjZDhjZmVlIi8+PHRleHQgeD0iNDU1LjUiIHk9IjEyNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjIiIGZvbnQtd2VpZ2h0PSJib
